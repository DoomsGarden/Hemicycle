@font-face { font-family: "Hemicycle UI"; src: url("../fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
html, body { font-family: "Hemicycle UI", sans-serif; font-optical-sizing: auto; }
button, input, select, textarea { font-family: "Hemicycle UI", sans-serif; }
button { line-height: 1.25; }

.mini.news { padding: 0px; display: grid; place-items: center; }
