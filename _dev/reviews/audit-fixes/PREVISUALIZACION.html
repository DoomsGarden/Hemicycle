<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hemicycle · Escenas realistas en revisión</title><link rel="stylesheet" href="../../../css/result-transition.css"><style>body{margin:0;background:#0b1322;color:#eee1c3;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{padding:24px;max-width:560px}main button{background:#e0b642;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;font:inherit;margin:6px}p{line-height:1.5}</style><main><small>PREVISUALIZACIÓN · SIN DATOS DE JUGADOR</small><h1>Escenas de resultado</h1><p>Pruebas visuales con verificación simulada. Siguiente solo se habilita tras comprobar el resultado; la escena nunca se cierra automáticamente.</p><button data-demo="fast">Victoria</button><button data-demo="defeat">Derrota</button><button data-demo="slow">Victoria · red lenta</button><button data-demo="retry">Derrota · error y reintento</button><p id="status" aria-live="polite"></p></main><script src="../../../js/result-transition.js"></script><script>document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('main button').forEach(x=>x.disabled=true);const mode=b.dataset.demo,win=mode==='fast'||mode==='slow',a=new Audio('../../../audio/'+(win?'victory':'defeat')+'.mp3');a.volume=.5;a.play().catch(()=>{});let attempts=0;const verify=()=>{attempts++;return mode==='retry'&&attempts===1?Promise.reject(Error('Error simulado')):new Promise(r=>setTimeout(()=>r({}),mode==='slow'?6500:700));};await HemicycleResultTransition.show(win,verify,{retry:verify});document.getElementById('status').textContent='Comprobación completada. Ahora se mostrarían los resultados habituales.';document.querySelectorAll('main button').forEach(x=>x.disabled=false);});</script></html>
