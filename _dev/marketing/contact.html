<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:Inter;src:url('../../fonts/InterVariable.woff2')}*{box-sizing:border-box}body{width:1440px;margin:0;padding:36px 40px 28px;background:#071020;color:#ebdfc4;font-family:Inter,sans-serif}.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid #b99b5b66;margin-bottom:26px}.head img{width:300px}.head p{font-size:20px;color:#c5cde0}.gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}.gallery img{width:calc((100% - 54px)/4);height:auto;display:block;border:1px solid #c6a96577;border-radius:8px}footer{text-align:center;color:#bdc5d6;letter-spacing:3px;margin:24px 0 0;font-size:17px}</style></head><body><div class="head"><img src="../../assets/brand-wordmark.svg" alt="Hemiciclo"><p>7 capturas · Español · 1080 × 1920</p></div><div class="gallery" id="gallery"></div><footer>HEMICYCLE.ONLINE</footer><script src="slides.js"></script><script>for(const s of HemicyclePromoSlides){const im=document.createElement('img');im.src='../../docs/media/promos/'+s.id+'.jpg';im.alt=s.title.join(' ');document.getElementById('gallery').append(im);}</script></body></html>
