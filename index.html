<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e18">
<meta name="description" content="Colecciona cromos de politicos y gana el debate llegando a 100 votos.">

<style>
:root{--sat:26px;--sab:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#070b16;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:#e9ecf5;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.screen{position:relative;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:manipulation;background:linear-gradient(180deg,#070b16,#0d1730 60%,#080d18);display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:29;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) 12px 8px;background:rgba(10,15,28,.97);border-bottom:1px solid #1c2440;flex-shrink:0}
.brand{font-weight:800;letter-spacing:.4px;font-size:14px;line-height:1.05}
.brand span{display:block;font-size:8px;color:#e8b923;letter-spacing:1.8px;font-weight:700}
.abR{margin-left:auto;display:flex;gap:5px;align-items:center}
.pill{background:#1e2848;border:1px solid #2b3763;border-radius:99px;padding:3px 9px;font-size:10.5px;white-space:nowrap}
.pill.gold{border-color:#e8b923;color:#ffd76a;font-weight:700}
.pill.red{border-color:#d43b3b;color:#ff9b8a;font-weight:700}
.pill.green{border-color:#28a86b;color:#7fe0b0;font-weight:700}
.mini{background:#1e2848;border:1px solid #2b3763;color:#e9ecf5;border-radius:9px;padding:6px 9px;font-size:12px;min-height:34px;font-weight:700}
.mini.hot{background:#d43b3b;border-color:#ff8a6a;color:#fff}
.mini:active{background:#e8b923;color:#111}
.content{flex:1;padding:10px 12px 14px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border-radius:10px}
button:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
h2{font-size:18px;margin:0 0 3px}
h3{font-size:12.5px;margin:11px 0 5px;color:#ffd76a}
p{margin:0 0 7px;font-size:13px}
.sub{color:#8b93ab;font-size:11.5px;line-height:1.3}
.panel{background:#131b31;border:1px solid #232e52;border-radius:13px;padding:11px;margin-bottom:9px}
.panel.win{border-color:#28a86b;background:linear-gradient(180deg,#132a22,#131b31)}
.panel.lose{border-color:#d43b3b;background:linear-gradient(180deg,#2a1414,#131b31)}
.panel.gold-box{border-color:#e8b923;background:linear-gradient(180deg,rgba(232,185,35,.16),#131b31)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.mode{border:1px solid #232e52;background:#18213c;border-radius:13px;padding:10px;text-align:left;min-height:80px;transition:border-color .15s}
.mode:active{border-color:#e8b923}
.mode b{display:block;font-size:12.5px;color:#ffd76a;margin-bottom:2px}
.mode i{font-style:normal;color:#8b93ab;font-size:10.5px;line-height:1.25}
.btn{background:linear-gradient(180deg,#e8b923,#c9931a);color:#141414;border:none;font-weight:800;padding:12px 13px;font-size:13px;min-height:46px}
.btn:active{filter:brightness(1.12)}
.btn.ghost{background:#1e2848;color:#e9ecf5;border:1px solid #2b3763;font-weight:600}
.btn.danger{background:linear-gradient(180deg,#d43b3b,#a82828);color:#fff;border:1px solid #ff8a6a;font-weight:700}
.btn.sm{padding:7px 11px;font-size:11.5px;min-height:36px}
.btn.wide{width:100%}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar.between{justify-content:space-between}
.tabbar{position:sticky;bottom:0;margin-top:auto;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px 6px calc(var(--sab) + 10px);background:rgba(8,12,22,.99);border-top:1px solid #1c2440;flex-shrink:0}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:#8b93ab;padding:6px 0;min-height:50px;border-radius:10px;font-weight:600}
.tab .ic{font-size:17px;line-height:1.1}
.tab.on{color:#ffd76a;background:rgba(232,185,35,.12)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.sm{grid-template-columns:repeat(5,1fr);gap:5px}

/* === VENTANA EMERGENTE (MODAL DE CONFIRMACIÓN) === */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(4,7,15,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#131b31;border:1px solid #3b4c82;border-radius:15px;padding:16px;max-width:340px;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.85);animation:modalIn .16s ease-out}
@keyframes modalIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 6px;font-size:15px;color:#ffd76a}
.modal p{margin:0 0 14px;font-size:12.5px;color:#cfd6e8;line-height:1.38}
.modal .bar{justify-content:flex-end}

/* === VENTANA EMERGENTE SUPERIOR DE LOGRO OCULTO === */
.ach-toast{
  position:fixed;
  top:calc(var(--sat) + 10px);
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  width:calc(100% - 28px);
  max-width:360px;
  background:linear-gradient(135deg,#1d2646,#0e1428);
  border:2px solid #e8b923;
  border-radius:14px;
  padding:11px 14px;
  box-shadow:0 10px 28px rgba(0,0,0,.85), 0 0 18px rgba(232,185,35,.45);
  display:flex;
  align-items:center;
  gap:11px;
  pointer-events:none;
  opacity:1;
  animation:achDropIn .25s ease-out;
  transition:opacity .85s ease, transform .85s ease;
}
.ach-toast.fade-out{
  opacity:0;
  transform:translate(-50%, -12px);
}
@keyframes achDropIn{
  from{opacity:0;transform:translate(-50%, -18px)}
  to{opacity:1;transform:translate(-50%, 0)}
}
.ach-toast .ach-ic{
  flex:0 0 auto;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd76a,#c9931a);
  color:#141414;
  font-size:20px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 10px rgba(232,185,35,.6);
}
.ach-toast .ach-txt{flex:1;min-width:0}
.ach-toast .ach-txt b{display:block;font-size:12.5px;color:#ffd76a;letter-spacing:.3px;margin-bottom:2px}
.ach-toast .ach-txt span{display:block;font-size:11px;color:#e9ecf5;line-height:1.25}

/* === MARCO WEBP REACTIVO SEGÚN RAREZA === */
@keyframes gemShimmer {
  0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 7px var(--tier)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
}

.cromo{
  position: relative;
  aspect-ratio: 3 / 4.1;
  border-radius: 12px;
  border: none;
  background: linear-gradient(180deg, rgba(19,27,49,0.95), rgba(7,11,22,0.98));
  box-shadow: 0 8px 20px rgba(0,0,0,0.7), 0 0 12px var(--tier, rgba(232,185,35,0.4));
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
  transition: transform .15s ease;
}

.cromo .frame-overlay{
  position: absolute;
  inset: 0;
  background-image: url('cards/frame.webp');
  background-size: cover;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 4px var(--tier));
}

.cromo[style*="#b07a45"] .frame-overlay { filter: hue-rotate(140deg) saturate(1.2) drop-shadow(0 0 4px var(--tier)); }
.cromo[style*="#4a7fb5"] .frame-overlay { filter: hue-rotate(0deg) saturate(1) drop-shadow(0 0 4px var(--tier)); }
.cromo[style*="#8b5cf6"] .frame-overlay { filter: hue-rotate(240deg) saturate(1.5) drop-shadow(0 0 4px var(--tier)); }
.cromo[style*="#e8b923"] .frame-overlay { filter: hue-rotate(35deg) saturate(1.8) brightness(1.1) drop-shadow(0 0 6px var(--tier)); }

.cromo .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:rgba(255,255,255,.15)}
.cromo .art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.cromo .top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 6px 0}
.cromo .cost{background:rgba(0,0,0,.78);border:1px solid var(--tier,#555);border-radius:6px;padding:0 5px;font-size:11px;font-weight:900;color:#ffd76a}
.cromo .gem-wrap{display:inline-flex;align-items:center;justify-content:center;animation:gemShimmer 3.5s infinite ease-in-out}
.cromo .bot{position:relative;z-index:4;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92) 45%);padding:12px 6px 6px;font-size:9px;line-height:1.12}
.cromo .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cromo .st{display:block;color:#cfd6e8;font-weight:700}
.cromo.sel{border-color:transparent;box-shadow:0 0 0 2.5px #ffd76a inset, 0 8px 20px rgba(232,185,35,0.45)}
.cromo.lead{border-color:transparent}
.cromo.tgt{box-shadow:0 0 0 2.5px #ff8a6a inset, 0 8px 20px rgba(255,138,106,0.45)}
.cromo.busy{filter:saturate(.55) brightness(.85)}
.cromo .crown{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:#ffd76a;text-shadow:0 0 5px #000}
.cromo .lbl{position:absolute;z-index:5;top:2px;left:2px;font-size:8px;font-weight:800;color:#111;background:#ffd76a;border-radius:4px;padding:0 3px}
.star{position:absolute;z-index:6;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:1px solid #2b3763;background:rgba(8,12,24,.85);font-size:14px;padding:0;color:#8b93ab}
.star.on{background:#e8b923;color:#141414;border-color:#ffd76a}
.badge{position:absolute;z-index:6;bottom:2px;right:2px;background:rgba(8,12,24,.92);border:1px solid #2b3763;border-radius:99px;padding:1px 5px;font-size:9px;font-weight:800;color:#ffd76a}

.row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:5px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.row>*{flex:0 0 auto;width:84px;scroll-snap-align:center}
.tribuna{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tribuna .cromo{aspect-ratio:3 / 3.9}
.tribuna .slot{border:1px dashed #232e52;border-radius:9px;aspect-ratio:3 / 3.9;display:flex;align-items:center;justify-content:center;color:#39456e;font-size:12px;font-weight:700;text-align:center;padding:4px}
.tribuna .slot.tgt{border-color:#ff8a6a;color:#ff8a6a;border-style:solid;cursor:pointer}
.vbars{display:grid;gap:4px;margin-bottom:6px}
.vbar{display:flex;align-items:center;gap:6px;font-size:11px}
.vbar .track{flex:1;height:10px;background:#0c1324;border:1px solid #232e52;border-radius:99px;overflow:hidden}
.vbar .fill{height:100%;width:0;transition:width .25s ease}
.vbar.me .fill{background:linear-gradient(90deg,#3b6fd4,#6ea8ff)}
.vbar.foe .fill{background:linear-gradient(90deg,#d43b3b,#ff8a6a)}
.vbar b{min-width:30px;text-align:right;font-size:11.5px}
.tdp{display:flex;gap:3px;align-items:center}
.crystal{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #3b6fd4;background:#4f8bea;vertical-align:middle;margin-right:2px}
.crystal.off{background:#151d33;border-color:#2b3763}
.log{background:#0a1020;border:1px solid #232e52;border-radius:9px;padding:6px 8px;font-size:11px;min-height:48px;max-height:80px;overflow-y:auto;color:#c3cbe0}
.log .hi{color:#ffd76a}
.hint{background:#1a2547;border:1px solid #3b6fd4;border-radius:9px;padding:6px 8px;font-size:11.5px;color:#bcd2ff;margin-top:6px}
.gab{display:flex;gap:4px;margin:5px 0;flex-wrap:wrap}
.gab span{font-size:9.5px;border:1px solid #2b3763;border-radius:6px;padding:2px 5px;background:#0d1424;color:#8b93ab}
.gab span.on{color:#111;background:#ffd76a;border-color:#ffd76a;font-weight:800}
.gab span.field{color:#111;background:#7fe0b0;border-color:#7fe0b0;font-weight:800}
.gab span.pas{color:#ff9b8a;border-color:#d43b3b}
.chips{display:flex;gap:5px;overflow-x:auto;padding:2px 0 6px}
.chip{border:1px solid #2b3763;background:#1e2848;border-radius:99px;padding:7px 11px;font-size:11.5px;min-height:36px;white-space:nowrap}
.chip.on{background:#e8b923;color:#141414;border-color:#ffd76a;font-weight:800}
input{width:100%;background:#0b1224;border:1px solid #2b3763;border-radius:9px;color:#e9ecf5;padding:10px 11px;font:inherit;font-size:13px;min-height:44px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:5px 3px;border-bottom:1px solid #232e52;text-align:left}
th{color:#8b93ab;font-weight:600}
tr.you td{color:#ffd76a;font-weight:700;background:rgba(232,185,35,.14)}
tr.pro td{background:rgba(40,168,107,.1)}
tr.des td{background:rgba(212,59,59,.1)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.stat div{background:#0d1424;border:1px solid #232e52;border-radius:8px;padding:6px 3px;text-align:center}
.stat b{display:block;font-size:16px;color:#ffd76a}
.stat span{font-size:9.5px;color:#8b93ab}
.quote{background:#0d1424;border-left:3px solid #e8b923;border-radius:0 8px 8px 0;padding:6px 9px;margin:5px 0;font-size:12px}
.reveal{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ficha{display:flex;gap:12px;align-items:flex-start}
.ficha .caja{flex:0 0 auto;width:115px}
.doc{display:inline-flex;align-items:center;gap:5px;border:1px solid #2b3763;border-radius:99px;padding:2px 8px;font-size:10.5px;background:#0d1424}
.dot{width:8px;height:8px;border-radius:50%}
.err{background:#3a1414;border:1px solid #d43b3b;border-radius:8px;padding:7px;font-size:11px;margin-bottom:8px}
.foot{font-size:10px;color:#8b93ab;text-align:center;padding-top:6px}
</style>
</head>

var CARDS=[],BYID={};
DOCS.forEach(function(d){
 ['legendario','especial','raro','comun'].forEach(function(t){
  var t2=TIER[t];
  ROSTER[d.k][t].forEach(function(nm,ix){
   var c={id:slug(nm),n:nm,r:t,pa:d.k,
     c:t2.c[0]+(ix%(t2.c[1]-t2.c[0]+1)),
     a:t2.a[0]+((ix*3)%(t2.a[1]-t2.a[0]+1)),
     h:t2.h[0]+((ix*5)%(t2.h[1]-t2.h[0]+1)),
     v:t2.v};
   var pool=QPOOL[d.k],bes=QBESP[c.id];
   c.q=bes?bes.concat([pool[ix%pool.length]]):[pool[ix%pool.length],pool[(ix+4)%pool.length],pool[(ix+8)%pool.length]];
   CARDS.push(c);BYID[c.id]=c;
  });
 });
});
CARDS.sort(function(a,b){return TIERORDER[a.r]-TIERORDER[b.r]||(a.n<b.n?-1:1);});

var LS='hemiciclo_v21',LS2='hemiciclo_liga_v9';
function seedAlbum(d){
 var add=function(t,n){var p=shuffle(CARDS.filter(function(c){return c.r===t;}));for(var i=0;i<n;i++)d.album.push(p[i%p.length].id);};
 add('comun',18);add('raro',8);add('especial',3);add('legendario',1);
}
function D(){
 var d=lsGet(LS);
 if(!d||!d.album){
  d={fs:1500,elo:300,w:0,l:0,album:[],lastDaily:0,lastWeekly:0,dtWins:0,dtGoldUnlocked:false,dtGoldActive:false};
  seedAlbum(d);lsSet(LS,d);
 }
 if(typeof d.dtWins!=='number')d.dtWins=0;
 d.dtGoldUnlocked=!!d.dtGoldUnlocked;
 d.dtGoldActive=!!d.dtGoldActive;
 return d;
}
function saveD(d){lsSet(LS,d);}

function gem(rKey, col){
 var ptsCount = (rKey === 'legendario') ? 9 : (rKey === 'especial') ? 7 : (rKey === 'raro') ? 5 : 3;
 var pts=[], i, ang, rad;
 for(i=0; i < ptsCount * 2; i++){
  ang = -Math.PI / 2 + i * Math.PI / ptsCount;
  rad = (i % 2) ? 3.2 : 6.8;
  pts.push((10 + Math.cos(ang) * rad).toFixed(1) + ',' + (10 + Math.sin(ang) * rad).toFixed(1));
 }
 return '<span class="gem-wrap"><svg viewBox="0 0 20 20" width="14" height="14"><polygon points="'+pts.join(' ')+'" fill="'+col+'" stroke="rgba(255,255,255,0.7)" stroke-width=".9"/></svg></span>';
}

function initials(nm){
 var p=nm.split(' ').filter(function(w){return w.length>2;});
 if(!p.length)p=nm.split(' ');
 return (p[0].charAt(0)+(p[1]?p[1].charAt(0):'')).toUpperCase();
}

  +'<span style="display:none">'+esc(initials(nm))+'</span>';
}

var RANKS=[[0,'Aprendiz de pasillo'],[400,'Concejal'],[700,'Diputado'],[1000,'Portavoz'],[1300,'Ministro'],[1600,'Presidente']];
function rankName(e){var n=RANKS[0][1];for(var i=0;i<RANKS.length;i++)if(e>=RANKS[i][0])n=RANKS[i][1];return n;}
function copies(d,id){var n=0;for(var i=0;i<d.album.length;i++)if(d.album[i]===id)n++;return n;}
function uniqueAlbum(d){var m={},out=[];d.album.forEach(function(id){m[id]=(m[id]||0)+1;});Object.keys(m).forEach(function(id){if(BYID[id])out.push({id:id,c:BYID[id],n:m[id]});});return out;}

function paint(){
 var c=document.getElementById('content');if(!c)return;
 if(TICK){clearInterval(TICK);TICK=null;}

 c.innerHTML=((SCREENS[SCREEN]||SCREENS.menu)())+'<div class="foot">'+CARDS.length+' cromos &middot; 6 doctrinas &middot; gabinete de 5</div>';
 var tb=document.getElementById('tabbar');if(tb)tb.innerHTML=tabbar();
 if(SCREEN==='tienda')startTick();
}
function startTick(){
 TICK=setInterval(function(){
  var now=Date.now(),els=document.querySelectorAll('[data-cd]');
  for(var i=0;i<els.length;i++){
   var e=els[i],t=parseInt(e.getAttribute('data-cd'),10),left=Math.max(0,t-now);
   var h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);
   e.textContent=(h>0?h+'h ':'')+m+'m '+s+'s';
   if(left<=0){clearInterval(TICK);TICK=null;paint();return;}
  }
 },1000);
}

 +'<button class="btn" data-act="free" data-k="semanal"'+(wl>0?' disabled':'')+'>Semanal'+(wl>0?' (<span data-cd="'+(now+wl)+'">...</span>)':' (Listo)')+'</button>'

};

function packContents(k){
 var out=[],i;
 if(k==='diario'||k==='comun'){
  for(i=0;i<4;i++)out.push(pick(CARDS.filter(function(x){return x.r==='comun';})));
  out.push(Math.random()<0.2?pick(CARDS.filter(function(x){return x.r==='raro';})):pick(CARDS.filter(function(x){return x.r==='comun';})));
 } else if(k==='semanal'||k==='raro'){
  for(i=0;i<4;i++)out.push(pick(CARDS.filter(function(x){return x.r==='raro';})));
  out.push(Math.random()<0.25?pick(CARDS.filter(function(x){return x.r==='especial';})):pick(CARDS.filter(function(x){return x.r==='raro';})));
 } else if(k==='legendario'){
  out.push(pick(CARDS.filter(function(x){return x.r==='legendario';})));
  out.push(pick(CARDS.filter(function(x){return x.r==='especial';})));
  for(i=0;i<3;i++)out.push(pick(CARDS.filter(function(x){return x.r==='raro';})));
 } else {for(i=0;i<5;i++)out.push(pick(CARDS.filter(function(x){return x.r==='legendario';})));}
 return out;
}

function openPack(k,free){
 var d=D(),p=PACKS.filter(function(x){return x.k===k;})[0];
 if(!free){
  if(!p)return;
  if(d.fs<p.p){go('result',{who:'info',msg:'No tienes suficiente Fuerza Soberana. Necesitas '+p.p+' FS.',fs:0});return;}
 } else {
  if(k==='diario'){if(Date.now()<d.lastDaily+DAY)return;d.lastDaily=Date.now();}
  else if(k==='semanal'){if(Date.now()<d.lastWeekly+WEEK)return;d.lastWeekly=Date.now();}
  else return;
 }
 var cards=packContents(k);
 if(!free)d.fs-=p.p;
 cards.forEach(function(c){d.album.push(c.id);});
 saveD(d);
 go('sobre',{cards:cards.map(function(c){return c.id;}),k:k,free:!!free});
}

 }

  return;
 }
 LAST_BUILD={ids:BUILD.ids.slice(),leader:BUILD.leader};

function mk(c, isLeader){
 UID++;
 var a = c.a + (isLeader ? 1 : 0);
 var hm = c.h + (isLeader ? 3 : 0);
 return {uid:'u'+UID,k:c.id,n:c.n,a:a,h:hm,hm:hm,c:c.c,v:c.v,pa:c.pa,r:c.r,q:c.q,ready:true,buff:0};
}

function newBattle(mode,rival){
 clearAI();
 var d=D(),team=BUILD.ids.slice(0,5),ldrId=BUILD.leader||team[0];
 var eTeam=shuffle(CARDS.map(function(c){return c.id;})).slice(0,5);
 var diff=1;
 if(mode==='ranked')diff=1+(d.elo-300)/700;
 if(mode==='liga')diff=1+((3-(SO.div||3))*0.18);
 diff=Math.max(.8,Math.min(2,diff));
 G={mode:mode,rival:rival||pick(['Grupo Mixto','Bancada Gris','Coalicion Improbable','Grupo del Pasillo','Mesa del Cafe','Los Indecisos']),
  eTeam:eTeam,pTeam:team.slice(),
  n:0,over:false,done:false,side:'p',votes:{p:0,e:0},tdp:{p:0,e:0},tdpMax:{p:2,e:2},
  field:{p:[],e:[]},hand:{p:[],e:[]},deck:{p:[],e:[]},pas:{p:[],e:[]},log:[],sel:null,saved:{},leader:{}};
 var build=function(s,ids,lead){
  var dk=shuffle(ids).map(function(id){return mk(BYID[id], id===lead);}),lc=null,i;
  for(i=0;i<dk.length;i++)if(dk[i].k===lead)lc=dk[i];
  if(!lc){lc=mk(BYID[lead], true);dk.unshift(lc);}
  var hi=dk.indexOf(lc);
  if(hi>=0)dk.splice(hi,1);
  var hand=dk.splice(0,2);
  hand.unshift(lc);
  G.leader[s]=lc;G.deck[s]=dk;G.hand[s]=hand;
 };
 build('p',team,ldrId);
 build('e',eTeam,eTeam[Math.floor(Math.random()*eTeam.length)]);
 if(diff!==1){
  G.deck.e.concat(G.hand.e).forEach(function(c){
   c.a=Math.max(1,Math.round(c.a*diff));
   c.h=Math.max(1,Math.round(c.h*diff));
   c.hm=c.h;
  });
 }
 log('Comienza el debate contra '+G.rival+'.','hi');
 log('Tu gabinete: '+team.map(function(id){return BYID[id].n;}).join(', ')+'.');
 go('battle');
 startTurn('p');
}

function log(t,cls){if(!G)return;G.log.unshift('<div'+(cls?' class="'+cls+'"':'')+'>'+esc(t)+'</div>');if(G.log.length>40)G.log.pop();}
function doc(s){var l=G.leader[s];if(!l)return null;for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===l.uid)return l.pa;return null;}
function leaderOn(s){var l=G.leader[s];if(!l)return false;for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===l.uid)return true;return false;}
function enMano(s,uid){for(var i=0;i<G.hand[s].length;i++)if(G.hand[s][i].uid===uid)return true;return false;}
function enMesa(s,uid){for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===uid)return true;return false;}

function draw(s){
 if(!G.deck[s].length && G.pas[s].length){
  G.pas[s].forEach(function(c){c.h=c.hm;c.ready=true;});
  G.deck[s]=shuffle(G.pas[s]);
  G.pas[s]=[];
  log((s==='p'?'Tus oradores en descanso':'Los oradores rivales en descanso')+' vuelven al mazo.');
 }
 while(G.deck[s].length && G.hand[s].length<7){
  var c=G.deck[s].shift();
  if(!enMano(s,c.uid) && !enMesa(s,c.uid)){
   c.h=c.hm;
   c.ready=true;
   G.hand[s].push(c);
   break;
  }
 }
}

function startTurn(s){
 if(!G||G.over)return;
 if(G.n>=14){endByVotes();return;}
 G.n++;G.side=s;G.sel=null;
 G.tdpMax[s]=Math.min(6,G.tdpMax[s]+1);
 G.tdp[s]=G.tdpMax[s]+((doc(s)==='verborrea')?1:0);
 draw(s);
 if(doc(s)==='foco'&&leaderOn(s)){
  G.leader[s].h=Math.min(G.leader[s].hm,G.leader[s].h+1);
 }
 G.field[s].forEach(function(c){c.ready=true;});
 var gain=3;G.field[s].forEach(function(c){gain+=c.v;});
 G.votes[s]+=gain;
 var roundNum=Math.ceil(G.n/2);
 log('Ronda '+roundNum+'/7 ('+(s==='p'?'Tu turno':'Turno rival')+'): +'+gain+' votos.');
 paint();
 if(G.votes[s]>=100){finish(s);return;}
 if(s==='e'){clearAI();AITIMER=setTimeout(aiStep,520);}
}

function applyGuardia(s){
 if(doc(s)==='guardia' && G.field[s].length){
  var grew=false;
  G.field[s].forEach(function(c){
   if((c.buff||0)<3){c.buff=(c.buff||0)+1;c.a++;grew=true;}
  });
  if(grew)log('Vieja Guardia: los oradores '+(s==='p'?'tuyos':'rivales')+' ganan +1 Zasca.');
 }
}

function endTurn(){
 if(!G||G.over||G.side!=='p')return;
 applyGuardia('p');
 G.sel=null;
 startTurn('e');
}

function expel(owner,card,attacker){
 var victim=owner==='p'?'e':'p';
 if(!enMesa(victim,card.uid))return;
 if(doc(victim)==='aforado'&&!G.saved[card.uid]){
  G.saved[card.uid]=true;card.h=1;
  log(card.n+' invoca el Aforado y se aferra al escano con 1 de Aguante.','hi');
  return;
 }
 G.field[victim]=G.field[victim].filter(function(c){return c.uid!==card.uid;});
 card.h=card.hm;
 card.ready=true;
 G.pas[victim].push(card);
 if(attacker){
  G.votes[owner]+=card.v;
  log(card.n+' es expulsado: +'+card.v+' votos '+(owner==='p'?'para ti.':'para '+G.rival+'.'),'hi');
 } else {
  log(card.n+' abandona la Tribuna.');
 }
 if(doc(victim)==='verborrea'){
  G.tdp[victim]+=2;
  log('Verborrea: +2 TdP para '+(victim==='p'?'ti.':'el rival.'));
 }
}

function playCard(s,uid){
 var idx=-1,i;
 for(i=0;i<G.hand[s].length;i++)if(G.hand[s][i].uid===uid)idx=i;
 if(idx<0)return false;
 var c=G.hand[s][idx];
 if(c.c>G.tdp[s]||G.field[s].length>=3)return false;
 G.hand[s].splice(idx,1);
 c.h=c.hm;
 c.ready=true;
 G.field[s].push(c);G.tdp[s]-=c.c;
 log((s==='p'?'Presentas':'El rival presenta')+' a '+c.n+(c.uid===G.leader[s].uid?' (Lider en Tribuna: doctrina '+DOCM[c.pa].n+' activa).':'.'));
 return true;
}

function attack(atk,tgt,owner){
 var foe=owner==='p'?'e':'p';
 var ownerDoc=doc(owner),foeDoc=doc(foe);
 atk.ready=false;
 if(tgt==='__EMPTY'){
  var stolen=Math.min(G.votes[foe],atk.a);
  G.votes[foe]=Math.max(0,G.votes[foe]-atk.a);
  log(atk.n+' lanza '+pick(atk.q)+' a la bancada vacia (-'+stolen+' votos '+(foe==='e'?'al rival':'para ti')+').','hi');
  if(ownerDoc==='foco'&&G.leader[owner]&&atk.uid===G.leader[owner].uid){
   G.votes[owner]+=1;
   log('Foco Mediatico: +1 voto para '+(owner==='p'?'ti.':G.rival+'.'));
  }
  if(G.votes[owner]>=100){finish(owner);return;}
  return;
 }
 var isFoeLead=(G.leader[foe]&&tgt.uid===G.leader[foe].uid);
 var bonus=(ownerDoc==='viperina'&&isFoeLead)?2:0;
 log(atk.n+' lanza '+pick(atk.q)+' ('+(atk.a+bonus)+' de dano a '+tgt.n+').','hi');
 tgt.h-=atk.a+bonus;
 if(foeDoc==='giro'&&tgt!==atk){
  atk.h-=2;
  log('Giro de Guion: '+atk.n+' recibe 2 de dano.');
 }
 if(ownerDoc==='foco'&&G.leader[owner]&&atk.uid===G.leader[owner].uid){
  G.votes[owner]+=1;
  log('Foco Mediatico: +1 voto para '+(owner==='p'?'ti.':G.rival+'.'));
 }
 if(atk.h<=0)expel(foe,atk,null);
 if(tgt.h<=0)expel(owner,tgt,atk);
 if(G.votes[owner]>=100){finish(owner);return;}
}

function endByVotes(){
 if(!G)return;
 G.over=true;
 log('Fin de las 7 rondas reglamentarias. Recuento de votos...','hi');
 if(G.votes.p>G.votes.e)finish('p');
 else if(G.votes.e>G.votes.p)finish('e');
 else finish('d');
}

function finish(who){
 if(!G||G.done)return;
 clearAI();
 G.over=true;G.done=true;
 var d=D(),mode=G.mode,fs=0,msg='',won=null,lost=null,comp=(mode!=='normal'),justUnlockedGold=false;
 if(who==='p'){
  fs=mode==='normal'?rnd(20,50):rnd(50,100);
  d.w++;if(mode==='ranked')d.elo+=25;
  msg='Victoria parlamentaria ('+G.votes.p+' a '+G.votes.e+'). Consigues '+fs+' FS.';
  if(comp&&G.eTeam.length){won=pick(G.eTeam);d.album.push(won);msg+=' Le arrebatas el escano de '+BYID[won].n+'.';}
  /* Comprobación del logro oculto: 10 victorias en Clasificatoria y/o Liga con Donald Trump como Líder */
  if(comp && G.leader && G.leader.p && G.leader.p.k==='donald-trump'){
   d.dtWins=(d.dtWins||0)+1;
   if(d.dtWins>=10 && !d.dtGoldUnlocked){
    d.dtGoldUnlocked=true;
    justUnlockedGold=true;
   }
  }
 } else if(who==='e'){
  fs=mode==='normal'?0:rnd(20,30);
  d.l++;if(mode==='ranked')d.elo=Math.max(0,d.elo-20);
  msg='Derrota ('+G.votes.p+' a '+G.votes.e+').'+(fs?' Recuperas '+fs+' FS.':'');
  if(comp&&G.pTeam.length&&d.album.length){
   var uniqCount=uniqueAlbum(d).length;
   var candidates=G.pTeam.filter(function(id){return uniqCount>5 || copies(d,id)>1;});
   if(candidates.length){
    lost=pick(candidates);
    var idx=d.album.indexOf(lost);
    if(idx>=0)d.album.splice(idx,1);
    msg+=' Pierdes una copia de '+BYID[lost].n+'.';
   } else {
    msg+=' El Seguro Parlamentario protege tus 5 ultimos politicos unicos.';
   }
  }
 } else {
  fs=25;
  msg='Empate tecnico en el hemiciclo ('+G.votes.p+' a '+G.votes.e+'). Recibes 25 FS.';
 }
 d.fs+=fs;saveD(d);
 if(justUnlockedGold){
  showAchievement('¡Logro Oculto Desbloqueado!','Magnate Dorado: Aspecto Golden de Donald Trump disponible en tu Coleccion.');
 }
 if(mode==='liga'){ligaResult(who,{msg:msg,fs:fs,won:won,lost:lost});return;}
 go('result',{who:who,msg:msg,fs:fs,won:won,lost:lost,mode:mode});
}

 +sorted.map(function(t,ix){return '<tr class="'+(t.you?'you':(ix<5?'pro':(ix>24?'des':'')))+'"><td>'+(ix+1)+'</td><td>'+esc(t.n)+'</td><td>'+t.pts+'</td><td>'+t.w+'-'+t.d+'-'+t.l+'</td></tr>';}).join('')

/* === MOTOR DINÁMICO DE IA PASO A PASO === */
function aiStep(){
 if(!G||G.over||G.side!=='e')return;
 if(G.field.e.length<3){
  var playable=G.hand.e.filter(function(c){return c.c<=G.tdp.e;}).sort(function(a,b){return b.c-a.c;});
  if(playable.length){
   playCard('e',playable[0].uid);
   paint();
   if(!G.over)AITIMER=setTimeout(aiStep,450);
   return;
  }
 }
 var readyAtk=G.field.e.filter(function(c){return c.ready;});
 if(readyAtk.length){
  var atk=readyAtk[0];
  var targets=G.field.p.slice().sort(function(a,b){return a.h-b.h;});
  var tgt=targets.length ? targets[0] : '__EMPTY';
  attack(atk,tgt,'e');
  paint();
  if(!G.over)AITIMER=setTimeout(aiStep,480);
  return;
 }
 applyGuardia('e');
 paint();
 AITIMER=setTimeout(function(){
  if(G&&!G.over)startTurn('p');
 },380);
}

function cromoBattle(c,side,extra){
 var r=RARM[c.r],isLead=G.leader[side]&&G.leader[side].uid===c.uid;
 var isTarget=(side==='e'&&G.sel);
 var art=artTag(c.k,c.n);
 return '<div class="cromo'+(G.sel===c.uid?' sel':'')+(isLead?' lead':'')+(isTarget?' tgt':'')+(side==='p'&&!c.ready?' busy':'')+'" style="--tier:'+r.c+(extra?';'+extra:'')+'" data-buid="'+c.uid+'" data-side="'+side+'">'
  +'<div class="art">'+art+'</div>'
  +'<div class="frame-overlay"></div>'
  +'<div class="top"><span class="cost">'+c.c+'</span>'+gem(c.r, r.c)+'</div>'
  +(isLead?'<span class="crown">&#9733;</span>':'')
  +(side==='p'&&!c.ready?'<span class="lbl">hecho</span>':'')
  +'<div class="bot"><span class="nm">'+esc(c.n)+'</span><span class="st">Z'+c.a+' &middot; A'+Math.max(0,c.h)+'/'+c.hm+'</span></div></div>';
}
function nmByUid(uid){var i;for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===uid)return G.field.p[i].n;return '?';}
function uidOf(uid){var i;for(i=0;i<G.hand.p.length;i++)if(G.hand.p[i].uid===uid)return G.hand.p[i].k;return '';}
function gabLine(){
 var est=G.pTeam.map(function(id){
  var c=null,i;
  for(i=0;i<G.hand.p.length;i++)if(G.hand.p[i].k===id)c='mano';
  for(i=0;i<G.field.p.length;i++)if(G.field.p[i].k===id)c='mesa';
  for(i=0;i<G.pas.p.length;i++)if(G.pas.p[i].k===id)c='fuera';
  return {n:BYID[id].n,s:c||'mazo'};
 });
 return '<div class="gab">'+est.map(function(e){
  var cls=e.s==='mano'?'on':(e.s==='mesa'?'field':(e.s==='fuera'?'pas':''));
  return '<span class="'+cls+'">'+esc(e.n.split(' ')[0])+'</span>';
 }).join('')+'</div>';
}

 if(!G)return '<p>Cargando...</p>';
 if(G.sel){var found=false,i2;for(i2=0;i2<G.field.p.length;i2++)if(G.field.p[i2].uid===G.sel)found=true;if(!found)G.sel=null;}
 var i,tdp='',etdp='';

 var eLeadOn=leaderOn('e'),pLeadOn=leaderOn('p');

 +'<div class="vbar foe"><span>'+esc(G.rival)+'</span><div class="track"><div class="fill" style="width:'+Math.min(100,G.votes.e)+'%"></div></div><b>'+G.votes.e+'/100</b></div></div>'
 +'<p class="sub">Rival &middot; TdP '+G.tdp.e+'/6 '+etdp+' &middot; Doctrina: '+(eLeadOn?'<b style="color:#ff9b8a">'+esc(DOCM[G.leader.e.pa].n)+'</b>':'inactiva')+'</p>'
 +'<div class="tribuna">'+ef+'</div>'

 +'<div class="row">'+hand+'</div>'

        :'<div class="hint">Toca una carta de tu mano para bajarla o un orador tuyo en Tribuna para atacar.</div>')

 +'<button class="btn ghost" data-act="abandon">Abandonar</button></div>';
};

var LNAMES=['Grupo Nacional','Bancada Popular','Union Civica','Frente Comun','Alianza Soberana','Grupo Liberal','Coalicion Verde','Bloque Regional','Partido del Centro','Grupo Independiente','Union Patriotica','Frente Amplio','Grupo Federal','Nueva Bancada','Coalicion Civica','Bloque Obrero','Grupo Democratico','Union Progresista','Frente Nacional','Grupo Social','Alianza Popular','Bloque Ciudadano','Grupo Reformista','Union Democratica','Frente Civico','Grupo del Norte','Bancada del Sur','Alianza Federal','Grupo Radical','Frente del Centro'];
function ligaNew(div){
 var teams=LNAMES.slice(0,30).map(function(n){return {n:n,pts:0,w:0,d:0,l:0,you:false,str:rnd(30,80)};});
 teams[0].you=true;teams[0].n='Tu grupo';teams[0].str=60;
 return {div:div||3,jor:1,temp:1,teams:teams};
}
function ligaLoad(){return lsGet(LS2);}
function ligaResult(who,info){
 var lg=ligaLoad();
 if(!lg){go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga'});return;}
 var me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
 if(!me){go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga'});return;}
 if(who==='p'){me.pts+=3;me.w++;}else if(who==='e'){me.l++;}else{me.pts+=1;me.d++;}
 simRound(lg,me);
 lg.jor++;
 if(lg.jor>12){seasonEnd(lg,info);return;}
 lsSet(LS2,lg);
 go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga',liga:true});
}
function simRound(lg,me){
 var others=shuffle(lg.teams.filter(function(t){return t!==me;}));
 for(var i=0;i<others.length-1;i+=2){
  var a=others[i],b=others[i+1],ra=a.str+rnd(0,30),rb=b.str+rnd(0,30);
  if(ra>rb){a.pts+=3;a.w++;b.l++;}else if(rb>ra){b.pts+=3;b.w++;a.l++;}else{a.pts++;b.pts++;a.d++;b.d++;}
 }
}
function seasonEnd(lg,info){
 var d=D(),me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
 var sorted=lg.teams.slice().sort(function(a,b){return b.pts-a.pts||b.w-a.w;});
 var pos=sorted.indexOf(me)+1,reward=rnd(700,1100);
 d.fs+=reward;saveD(d);
 var nd=lg.div;if(pos<=5&&lg.div>1)nd=lg.div-1;else if(pos>25&&lg.div<3)nd=lg.div+1;
 var nm=function(x){return x===1?'Primera':(x===2?'Segunda':'Tercera');};
 var msg=info.msg+' Terminas '+pos+'º de 30 en '+nm(lg.div)+' con '+me.pts+' puntos. Recompensa de fin de temporada: +'+reward+' FS. ';
 msg+=nd<lg.div?('¡ASCENSO a '+nm(nd)+'!'):(nd>lg.div?('DESCENSO a '+nm(nd)+'.'):'Mantienes la categoria.');
 var fresh=ligaNew(nd);fresh.temp=lg.temp+1;lsSet(LS2,fresh);
 go('result',{who:'season',msg:msg,fs:info.fs+reward,won:info.won,lost:info.lost,mode:'liga',season:true});
}

 +'</tbody></table></div><p class="sub">Los 5 primeros ascienden, los 5 ultimos descienden.</p>'

 return '<h2>Como se juega</h2>'
 +'<div class="panel"><h3>Objetivo</h3><p>Cada turno ganas 3 votos base mas los escanos de tus oradores en la Tribuna. Gana quien llegue a <b>100 votos</b> o quien tenga mas votos al finalizar las <b>7 rondas</b>. Expulsar a un orador rival suma sus escanos a tu marcador.</p></div>'

 +'<button class="btn wide" data-go="menu">Volver</button>';

document.addEventListener('click',function(ev){
 var t=ev.target;
 var root=document.getElementById('app')||document.body;
 if(!root.contains(t)||!t.closest)return;

 var mBtn=t.closest('[data-modal]');
 if(mBtn){
  var mAct=mBtn.getAttribute('data-modal');
  var cb=MODAL_CB;
  closeModal();
  if(mAct==='confirm' && typeof cb==='function')cb();
  return;
 }

 var n=t.closest('[data-go],[data-act],[data-lead],[data-pick],[data-card],[data-buid],[data-fr],[data-fd]');
 if(!n||n.disabled)return;

 if(n.hasAttribute('data-fr')){FIL.r=n.getAttribute('data-fr');paint();return;}
 if(n.hasAttribute('data-fd')){FIL.d=n.getAttribute('data-fd');paint();return;}

 if(n.hasAttribute('data-lead')){
  var lid=n.getAttribute('data-lead');
  if(BUILD.ids.indexOf(lid)<0){
   if(BUILD.ids.length>=5)BUILD.ids.pop();
   BUILD.ids.unshift(lid);
  }
  BUILD.leader=lid;
  paint();return;
 }

 if(n.hasAttribute('data-pick')){
  var pid=n.getAttribute('data-pick'),ix=BUILD.ids.indexOf(pid);
  if(ix>=0){
   BUILD.ids.splice(ix,1);
   if(BUILD.leader===pid)BUILD.leader=BUILD.ids[0]||null;
  } else if(BUILD.ids.length<5){
   BUILD.ids.push(pid);
  } else {
   var oldId=BUILD.ids[4];
   BUILD.ids[4]=pid;
   if(BUILD.leader===oldId)BUILD.leader=pid;
  }
  if(!BUILD.leader&&BUILD.ids.length)BUILD.leader=BUILD.ids[0];
  paint();return;
 }

 if(n.hasAttribute('data-buid')){
  var uid=n.getAttribute('data-buid'),side=n.getAttribute('data-side');
  if(!G||G.over||G.side!=='p')return;
  var i;
  if(enMano('p',uid)){
   var cardKey=uidOf(uid);
   if(G.field.p.length>=3){
    log('Tu Tribuna ya tiene el maximo de 3 oradores.');
   } else if(!playCard('p',uid)){
    log('No te llega el Tiempo de Palabra para presentar a '+(BYID[cardKey]?BYID[cardKey].n:'este orador')+'.');
   }
   paint();return;
  }
  if(side==='e'){
   if(!G.sel){log('Elige primero un orador tuyo de la Tribuna para atacar.');paint();return;}
   var atk=null,tgt=null;
   for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===G.sel)atk=G.field.p[i];
   for(i=0;i<G.field.e.length;i++)if(G.field.e[i].uid===uid)tgt=G.field.e[i];
   if(!tgt)tgt='__EMPTY';
   if(atk&&atk.ready){attack(atk,tgt,'p');G.sel=null;paint();}
   return;
  }
  var own=null;
  for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===uid)own=G.field.p[i];
  if(own){
   if(!own.ready){log(own.n+' ya ha intervenido en este turno.');paint();return;}
   G.sel=(G.sel===uid)?null:uid;paint();
  }
  return;
 }

 if(n.hasAttribute('data-card')&&SCREEN==='coleccion'){
  go('detalle',{id:n.getAttribute('data-card')});return;
 }

 var act=n.getAttribute('data-act'),dest=n.getAttribute('data-go');
 if(dest){
  if(dest==='builder'){
   SO={mode:n.getAttribute('data-mode')||'normal'};
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
  }
  if(dest==='tienda')FIL={q:'',r:'',d:''};
  if(dest==='battle'&&!G)return;
  go(dest);return;
 }
 if(!act)return;

 switch(act){
  case 'dtskin':
   if(SCREEN==='detalle' && SO.id==='donald-trump'){
    var d=D();
    if(d.dtGoldUnlocked){
     d.dtGoldActive=(n.getAttribute('data-val')==='golden');
     saveD(d);
     paint();
    }
   }
   break;
  case 'reset':
   showModal(
    '¿Borrar todo el progreso?',
    'Perderas tu coleccion de cromos, tu Fuerza Soberana, tu rango Elo, logros y el avance en la Liga. Esta accion no se puede deshacer.',
    'Si, borrar todo',
    true,
    function(){
     clearAI();
     try{localStorage.removeItem(LS);localStorage.removeItem(LS2);}catch(e){}
     MEM={};G=null;BUILD={ids:[],leader:null};LAST_BUILD={ids:[],leader:null};
     D();go('menu');
    }
   );
   break;
  case 'rapida':
   autoBuild();
   LAST_BUILD={ids:BUILD.ids.slice(),leader:BUILD.leader};
   SO={mode:'normal'};
   newBattle('normal');
   break;
  case 'auto':
   autoBuild();paint();break;
  case 'clear':
   BUILD={ids:[],leader:null};paint();break;
  case 'start':
   startBattle();break;
  case 'buy':
   openPack(n.getAttribute('data-k'),false);break;
  case 'free':
   openPack(n.getAttribute('data-k'),true);break;
  case 'again':
   openPack(n.getAttribute('data-k')||SO.k,false);break;
  case 'end':
   endTurn();break;
  case 'abandon':
   if(G&&!G.over){
    showModal(
     '¿Abandonar el debate?',
     'Si abandonas el hemiciclo ahora, se contara como una derrota'+(G.mode!=='normal'?' y podrias perder una copia de un cromo de tu gabinete':'')+'.',
     'Abandonar debate',
     true,
     function(){if(G&&!G.over)finish('e');}
    );
   }
   break;
  case 'rev':{
   var m=n.getAttribute('data-mode')||'normal';
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
   SO={mode:m};
   go('builder');
   break;
  }
  case 'liganew':
   lsSet(LS2,ligaNew(3));go('liga');break;
  case 'ligabandon':
   showModal(
    '¿Abandonar la Liga actual?',
    'Se borrara tu clasificacion y progreso de jornadas de la temporada actual para que puedas empezar una nueva desde Tercera.',
    'Si, abandonar liga',
    true,
    function(){
     try{localStorage.removeItem(LS2);}catch(e){}
     MEM[LS2]=null;
     go('liga');
    }
   );
   break;
  case 'ligajugar':{
   var lg=ligaLoad();if(!lg){go('liga');break;}
   var sorted=lg.teams.slice().sort(function(a,b){return b.pts-a.pts||b.w-a.w;});
   var me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
   var pos=sorted.indexOf(me)+1,rival=sorted[(pos-1+3)%30];
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
   go('builder',{mode:'liga',rival:rival.n,div:lg.div,jor:lg.jor});
   break;
  }
 }
},false);

function medirInsets(){
 try{
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);
  var cs=getComputedStyle(d);
  var t=parseFloat(cs.paddingTop)||0, b=parseFloat(cs.paddingBottom)||0;
  document.body.removeChild(d);
  var st=document.documentElement.style;
  st.setProperty('--sat',Math.max(t,26)+'px');
  st.setProperty('--sab',Math.max(b,16)+'px');
 }catch(e){}
}
window.addEventListener('resize',medirInsets);
window.addEventListener('orientationchange',medirInsets);

function boot(){
 medirInsets();
 try{history.replaceState({s:'menu'},'');}catch(e){}
 D();paint();
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
}
try{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();}
catch(e){window.onerror(e.message,'boot',0,0);}
})();
