<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e18">
<meta name="description" content="Colecciona cromos de políticos y gana el debate llegando a 100 votos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hemiciclo: Cara a Cara</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--sat:22px;--sab:12px}
*{box-sizing:border-box;scrollbar-width:none!important;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
html,body{margin:0;padding:0;width:100%;height:100%;background:#070b16;overflow:hidden;touch-action:pan-x pan-y}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:#e9ecf5;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* === ESTRUCTURA FIJA ENTRE APPBAR Y TABBAR === */
.screen{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  touch-action:pan-x pan-y;
  background:linear-gradient(180deg,#070b16,#0d1730 60%,#080d18);
  display:flex;
  flex-direction:column;
}
.appbar{
  z-index:29;
  display:flex;
  align-items:center;
  gap:6px;
  padding:calc(var(--sat) + 4px) 12px 7px;
  background:rgba(10,15,28,.98);
  border-bottom:1px solid #1c2440;
  flex-shrink:0;
}
.tabbar{
  z-index:30;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  padding:5px 6px calc(var(--sab) + 6px);
  background:rgba(8,12,22,.99);
  border-top:1px solid #1c2440;
  flex-shrink:0;
}
.screen.in-battle .appbar,
.screen.in-battle .tabbar{
  display:none !important;
}
.screen.in-battle .content{
  padding-top:calc(var(--sat) + 6px);
  padding-bottom:calc(var(--sab) + 6px);
}

.content{
  flex:1;
  min-height:0;
  overflow:hidden;
  padding:8px 11px 6px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.content.scroll-ok{
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  justify-content:flex-start;
}
.view-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
}
.content.scroll-ok .view-body{
  overflow:visible;
  flex:0 0 auto;
}
.inner-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-right:2px;
}

.brand{font-weight:800;letter-spacing:.4px;font-size:13.5px;line-height:1.05;flex-shrink:0}
.brand span{display:block;font-size:7.5px;color:#e8b923;letter-spacing:1.8px;font-weight:700}
.abR{margin-left:auto;display:flex;gap:5px;align-items:center;min-width:0}
.pill{background:#1e2848;border:1px solid #2b3763;border-radius:99px;padding:2px 8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.pill.gold{border-color:#e8b923;color:#ffd76a;font-weight:700;flex-shrink:0}
.pill.red{border-color:#d43b3b;color:#ff9b8a;font-weight:700;flex-shrink:0}
.pill.green{border-color:#28a86b;color:#7fe0b0;font-weight:700;flex-shrink:0}
.mini{background:#1e2848;border:1px solid #2b3763;color:#e9ecf5;border-radius:8px;padding:5px 8px;font-size:11.5px;min-height:30px;font-weight:700;flex-shrink:0}
.mini.hot{background:#d43b3b;border-color:#ff8a6a;color:#fff}
.mini:active{background:#e8b923;color:#111}
.mini.news{width:30px;height:30px;padding:6px;display:grid;place-items:center}
.abR>.pill:not(.gold){min-width:0}
.release-entry{background:#131b31;border:1px solid #232e52;border-radius:11px;margin-bottom:8px}
.release-entry.current{border-color:#8b6b21}
.release-entry summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:12px;min-height:60px;border-radius:10px}
.release-entry summary::-webkit-details-marker{display:none}
.release-entry summary:focus-visible{outline:2px solid #ffd76a;outline-offset:-3px}
.release-heading{flex:1;min-width:0}
.release-heading b{color:#ffd76a;font-size:13px}
.release-heading time{font-size:10px;color:#aab4cd;margin-left:8px}
.release-heading span{display:block;font-size:12px;line-height:1.4;margin-top:3px}
.release-chevron{flex-shrink:0;color:#ffd76a;transform:rotate(0deg);transition:transform .22s ease}
.release-entry[open] .release-chevron{transform:rotate(180deg)}
.release-content{padding:0 14px 12px;font-size:12px;line-height:1.5;color:#cfd6e8}
.release-content h3{font-size:12px;margin:8px 0 4px}
.release-content ul{margin:0;padding-left:18px}
.release-content li{margin:5px 0}
.release-entry[open] .release-content{animation:releaseReveal .2s ease-out}
@keyframes releaseReveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.release-chevron{transition:none}.release-entry[open] .release-content{animation:none}}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border-radius:10px}
button:disabled{opacity:.42;cursor:not-allowed;pointer-events:none}
h2{font-size:16px;margin:0;line-height:1.15;flex-shrink:0}
h3{font-size:11.5px;margin:4px 0 3px;color:#ffd76a;flex-shrink:0}
p{margin:0 0 4px;font-size:12px}
.sub{color:#8b93ab;font-size:10.5px;line-height:1.25;margin:0;flex-shrink:0}
.panel{background:#131b31;border:1px solid #232e52;border-radius:11px;padding:8px 10px;margin:0;flex-shrink:0}
.panel.win{border-color:#28a86b;background:linear-gradient(180deg,#132a22,#131b31)}
.panel.lose{border-color:#d43b3b;background:linear-gradient(180deg,#2a1414,#131b31)}
.panel.gold-box{border-color:#e8b923;background:linear-gradient(180deg,rgba(232,185,35,.16),#131b31)}
.coin-toss{text-align:center;display:grid;gap:12px}
.coin-toss h3{font-size:16px}
.coin-toss p{margin:0}
.coin-face{display:grid;place-items:center;width:80px;height:80px;margin:0 auto;border:3px solid #ffd76a;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a0,#c9931a);box-shadow:inset 0 0 0 5px #a97816;color:#141414;font-size:14px;font-weight:800}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}
.mode{border:1px solid #232e52;background:#18213c;border-radius:11px;padding:8px 9px;text-align:left;min-height:62px;transition:border-color .15s}
.mode:active{border-color:#e8b923}
.mode b{display:block;font-size:12px;color:#ffd76a;margin-bottom:2px}
.mode i{font-style:normal;color:#8b93ab;font-size:10px;line-height:1.2;display:block}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-height:0;overflow-y:auto}
.doc-card{background:#0d1424;border:1px solid #1f2a4d;border-radius:8px;padding:5px 7px}
.doc-card .sub{font-size:9.5px;line-height:1.18;margin-top:2px;display:block}

.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0}
.pack-card{background:#131b31;border:1px solid #232e52;border-radius:11px;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.pack-card h3{margin:0 0 3px;font-size:12px}
.pack-card .sub{font-size:10px;margin-bottom:6px}

.btn{background:linear-gradient(180deg,#e8b923,#c9931a);color:#141414;border:none;font-weight:800;padding:9px 12px;font-size:12px;min-height:38px;flex-shrink:0}
.btn:active{filter:brightness(1.12)}
.btn.ghost{background:#1e2848;color:#e9ecf5;border:1px solid #2b3763;font-weight:600}
.btn.danger{background:linear-gradient(180deg,#d43b3b,#a82828);color:#fff;border:1px solid #ff8a6a;font-weight:700}
.btn.sm{padding:6px 10px;font-size:11px;min-height:32px}
.btn.wide{width:100%}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.bar.between{justify-content:space-between}

.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;color:#8b93ab;padding:4px 0;min-height:44px;border-radius:9px;font-weight:600}
.tab .ic{font-size:16px;line-height:1.1}
.tab.on{color:#ffd76a;background:rgba(232,185,35,.12)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.sm{grid-template-columns:repeat(5,1fr);gap:5px}
/* === VENTANA EMERGENTE (MODAL DE CONFIRMACIÓN) === */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(4,7,15,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#131b31;border:1px solid #3b4c82;border-radius:15px;padding:16px;max-width:340px;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.85);animation:modalIn .16s ease-out}
@keyframes modalIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 6px;font-size:15px;color:#ffd76a}
.modal p{margin:0 0 14px;font-size:12.5px;color:#cfd6e8;line-height:1.38}
.modal .bar{justify-content:flex-end}

/* === VISOR EMERGENTE DE CROMO EN GRANDE (ZOOM + SWIPE) === */
.zoom-bg{
  position:fixed;
  inset:0;
  z-index:150;
  background:rgba(4,7,15,.88);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  cursor:pointer;
  touch-action:pan-y;
  animation:zoomFadeIn .16s ease-out;
}
@keyframes zoomFadeIn{from{opacity:0}to{opacity:1}}
.zoom-card-wrap{
  width:min(78vw, 300px, 54vh);
  max-height:74vh;
  aspect-ratio:3 / 4.1;
  position:relative;
  will-change:transform,opacity;
}
.zoom-card-wrap .cromo{
  width:100%;
  height:100%;
  border-radius:16px;
  box-shadow:0 18px 46px rgba(0,0,0,.92), 0 0 26px var(--tier, rgba(232,185,35,.55));
}
.zoom-card-wrap .cromo .top{padding:12px 12px 0}
.zoom-card-wrap .cromo .cost{font-size:20px;padding:2px 10px;border-radius:9px;border-width:1.5px}
.zoom-card-wrap .cromo .gem-wrap svg{width:26px;height:26px}
.zoom-card-wrap .cromo .badge{font-size:14px;padding:3px 10px;bottom:6px;right:6px}
.zoom-card-wrap .cromo .bot{padding:24px 12px 12px;font-size:16px}
.zoom-card-wrap .cromo .nm{font-size:17px;margin-bottom:3px}
.zoom-card-wrap .cromo .st{font-size:14.5px}
.zoom-card-wrap .cromo .art{font-size:52px}
.zoom-meta{
  margin-top:14px;
  text-align:center;
  pointer-events:none;
}
.zoom-meta b{display:block;font-size:13px;color:#ffd76a;margin-bottom:3px}
.zoom-meta span{font-size:11.5px;color:#cfd6e8;opacity:.85}

/* === CONTENEDOR DESLIZABLE DE LA FICHA DE STATS === */
.detalle-swipe{
  touch-action:pan-y;
  will-change:transform,opacity;
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.ficha .caja.zoomable{
  cursor:zoom-in;
  position:relative;
}
.ficha .caja.zoomable:active{
  transform:scale(.97);
}
.zoom-badge-hint{
  display:block;
  text-align:center;
  font-size:9px;
  color:#ffd76a;
  margin-top:3px;
  opacity:.85;
}
.nav-strip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#0d1424;
  border:1px solid #232e52;
  border-radius:9px;
  padding:4px 8px;
  flex-shrink:0;
}
.nav-strip span{
  font-size:10.5px;
  color:#8b93ab;
  text-align:center;
}
.nav-strip b{color:#ffd76a}

@keyframes slideInFromRight{
  from{transform:translateX(54px);opacity:.25}
  to{transform:translateX(0);opacity:1}
}
@keyframes slideInFromLeft{
  from{transform:translateX(-54px);opacity:.25}
  to{transform:translateX(0);opacity:1}
}
.anim-next{animation:slideInFromRight .2s cubic-bezier(.2,.8,.2,1)}
.anim-prev{animation:slideInFromLeft .2s cubic-bezier(.2,.8,.2,1)}

/* === VENTANA EMERGENTE SUPERIOR DE LOGRO OCULTO === */
.ach-toast{
  position:fixed;
  top:calc(var(--sat) + 10px);
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  width:calc(100% - 28px);
  max-width:360px;
  background:linear-gradient(135deg,#1d2646,#0e1428);
  border:2px solid #e8b923;
  border-radius:14px;
  padding:11px 14px;
  box-shadow:0 10px 28px rgba(0,0,0,.85), 0 0 18px rgba(232,185,35,.45);
  display:flex;
  align-items:center;
  gap:11px;
  pointer-events:none;
  opacity:1;
  animation:achDropIn .25s ease-out;
  transition:opacity .85s ease, transform .85s ease;
}
.ach-toast.fade-out{
  opacity:0;
  transform:translate(-50%, -12px);
}
@keyframes achDropIn{
  from{opacity:0;transform:translate(-50%, -18px)}
  to{opacity:1;transform:translate(-50%, 0)}
}
.ach-toast .ach-ic{
  flex:0 0 auto;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd76a,#c9931a);
  color:#141414;
  font-size:20px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 10px rgba(232,185,35,.6);
}
.ach-toast .ach-txt{flex:1;min-width:0}
.ach-toast .ach-txt b{display:block;font-size:12.5px;color:#ffd76a;letter-spacing:.3px;margin-bottom:2px}
.ach-toast .ach-txt span{display:block;font-size:11px;color:#e9ecf5;line-height:1.25}

/* === CONTENEDOR DE LIENZO PERSISTENTE PARA TRUMP GOLDEN === */
@keyframes gemShimmer {
  0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 7px var(--tier)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
}

.gold-slot{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#141c34;
}
.gold-slot img.gold-static-fb,
.gold-slot canvas.gold-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
}
.gold-slot.has-canvas img.gold-static-fb{
  display:none !important;
}

.cromo{
  position: relative;
  aspect-ratio: 3 / 4.1;
  border-radius: 10px;
  border: none;
  background: linear-gradient(180deg, rgba(19,27,49,0.95), rgba(7,11,22,0.98));
  box-shadow: 0 5px 14px rgba(0,0,0,0.65), 0 0 10px var(--tier, rgba(232,185,35,0.35));
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width:0;
  transition: transform .15s ease, box-shadow .15s ease;
}

.cromo .frame-overlay{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url('cards/frame.webp');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 3px var(--tier));
}

.cromo[style*="#b07a45"] .frame-overlay { filter: hue-rotate(140deg) saturate(1.2) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#4a7fb5"] .frame-overlay { filter: hue-rotate(0deg) saturate(1) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#8b5cf6"] .frame-overlay { filter: hue-rotate(240deg) saturate(1.5) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#e8b923"] .frame-overlay { filter: hue-rotate(35deg) saturate(1.8) brightness(1.1) drop-shadow(0 0 5px var(--tier)); }

.cromo.sel::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:3.5px solid #ffd76a;
  box-shadow:inset 0 0 14px rgba(255,215,106,.85), 0 0 12px rgba(255,215,106,.75);
  z-index:8;
  pointer-events:none;
}
.cromo.sel{
  transform:translateY(-2px);
}
.cromo.tgt::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:3px solid #ff8a6a;
  box-shadow:inset 0 0 12px rgba(255,138,106,.8);
  z-index:8;
  pointer-events:none;
}
.cromo .sel-tag{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:9;
  background:rgba(232,185,35,.95);
  color:#111;
  font-size:8.5px;
  font-weight:900;
  padding:2px 6px;
  border-radius:99px;
  letter-spacing:.4px;
  box-shadow:0 2px 8px rgba(0,0,0,.85);
  pointer-events:none;
  white-space:nowrap;
}

.cromo .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:rgba(255,255,255,.15)}
.cromo .art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.cromo .top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 6px 0}
.cromo .cost{background:rgba(0,0,0,.82);border:1px solid var(--tier,#555);border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:900;color:#ffd76a}
.cromo .gem-wrap{display:inline-flex;align-items:center;justify-content:center;animation:gemShimmer 3.5s infinite ease-in-out}
.cromo .bot{position:relative;z-index:4;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92) 45%);padding:10px 6px 5px;font-size:8.5px;line-height:1.12}
.cromo .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cromo .st{display:block;color:#cfd6e8;font-weight:700}
.cromo.busy{filter:saturate(.55) brightness(.85)}
.cromo .crown{position:absolute;top:1px;left:50%;transform:translateX(-50%);z-index:9;font-size:12px;color:#ffd76a;text-shadow:0 0 5px #000}
.cromo .lbl{position:absolute;z-index:9;top:3px;left:3px;font-size:8px;font-weight:800;color:#111;background:#ffd76a;border-radius:4px;padding:0 4px}
.star{position:absolute;z-index:9;top:3px;right:3px;width:25px;height:25px;border-radius:50%;border:1px solid #2b3763;background:rgba(8,12,24,.88);font-size:13px;padding:0;color:#8b93ab}
.star.on{background:#e8b923;color:#141414;border-color:#ffd76a;box-shadow:0 0 8px #ffd76a}
.badge{position:absolute;z-index:9;bottom:3px;right:3px;background:rgba(8,12,24,.92);border:1px solid #2b3763;border-radius:99px;padding:1px 5px;font-size:8.5px;font-weight:800;color:#ffd76a}

/* === LAYOUT COMPACTO DE BATALLA A PANTALLA COMPLETA === */
.battle-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:3px;
}
.row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;flex-shrink:0}
.row>*{flex:0 0 auto;width:74px;scroll-snap-align:center}
.tribuna{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;width:100%;margin:0 auto;flex-shrink:0}
.tribuna .cromo{aspect-ratio:3 / 3.7}
.tribuna .slot{border:1px dashed #232e52;border-radius:9px;aspect-ratio:3 / 3.7;display:flex;align-items:center;justify-content:center;color:#39456e;font-size:11px;font-weight:700;text-align:center;padding:4px}
.tribuna .slot.tgt{border-color:#ff8a6a;color:#ff8a6a;border-style:solid;cursor:pointer}
.vbars{display:grid;gap:3px;flex-shrink:0}
.vbar{display:flex;align-items:center;gap:6px;font-size:10.5px}
.vbar .track{flex:1;height:8px;background:#0c1324;border:1px solid #232e52;border-radius:99px;overflow:hidden}
.vbar .fill{height:100%;width:0;transition:width .25s ease}

(function(){
'use strict';
var VERSION='v31.0.1.4';
var UID=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function searchText(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
var MEM={};
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):(MEM[k]||null);}catch(e){return MEM[k]||null;}}
function localSaved(){if(typeof Event!=='undefined'&&document.dispatchEvent)document.dispatchEvent(new Event('hemicycle:local-save'));}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){MEM[k]=v;}localSaved();}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var ART_BASE='cards/';

/* === FOTOGRAMAS PRECARGADOS + BUCLE CON SOLAPAMIENTO FIJO === */
var GOLD_LOOP={
 state:'idle',
 frames:[],
 sequence:[],
 ends:[],
 w:0,
 h:0,
 duration:0,
 overlap:100,
 period:0,
 startedAt:0,
 surface:null,
 portrait:null,
 confetti:null,
 lastDraw:null,
 posterUrl:'',
 pool:[],
 rafId:null
};

function buildGoldTimeline(){
 var sequence=[],ends=[],total=0,i;
 for(i=0;i<GOLD_LOOP.frames.length;i++)sequence.push(i);
 for(i=0;i<sequence.length;i++){
  total+=GOLD_LOOP.frames[sequence[i]].dur;
  ends.push(total);
 }
 GOLD_LOOP.sequence=sequence;
 GOLD_LOOP.ends=ends;
 GOLD_LOOP.duration=total;
 GOLD_LOOP.overlap=sequence.length>1?Math.min(100,total/4):0;
 GOLD_LOOP.period=total-GOLD_LOOP.overlap;
}

function getGoldFrameIndex(time){
 var ends=GOLD_LOOP.ends,lo=0,hi=ends.length-1;
 while(lo<hi){
  var mid=(lo+hi)>>1;
  if(time<ends[mid])hi=mid;else lo=mid+1;
 }
 return GOLD_LOOP.sequence[lo];
}

function getGoldPlayback(now){
 // Use one absolute clock: missed animation ticks never extend the next cycle.
 var phase=Math.max(0,now-GOLD_LOOP.startedAt)%GOLD_LOOP.period;
 var next=getGoldFrameIndex(phase);
 if(GOLD_LOOP.overlap>0 && phase<GOLD_LOOP.overlap){
  return {first:getGoldFrameIndex(GOLD_LOOP.period+phase),second:next,mix:phase/GOLD_LOOP.overlap};
 }
 return {first:next,second:next,mix:0};
}

/* Las partículas usan tiempo continuo: la expresión puede retroceder, la caída no. */
function drawGoldConfetti(ctx,elapsed){
 if(!GOLD_LOOP.confetti)GOLD_LOOP.confetti=CardConfetti.create(CardConfetti.TRUMP);
 GOLD_LOOP.confetti.draw(ctx,elapsed);
}

function detachGoldPool(container){
 if(!container)return;
 var activeCvs=container.querySelectorAll('canvas.gold-canvas');
 for(var i=0;i<activeCvs.length;i++){
  var cv=activeCvs[i];
  if(cv.parentNode)cv.parentNode.removeChild(cv);
  if(GOLD_LOOP.pool.indexOf(cv)<0)GOLD_LOOP.pool.push(cv);
 }
}

function getPooledCanvas(){
 var cv=GOLD_LOOP.pool.pop();
 if(!cv){
  cv=document.createElement('canvas');
  cv.className='gold-canvas';
  cv._lastDraw=null;
 }
 if(GOLD_LOOP.w>0 && (cv.width!==GOLD_LOOP.w || cv.height!==GOLD_LOOP.h)){
  cv.width=GOLD_LOOP.w;
  cv.height=GOLD_LOOP.h;
  cv._lastDraw=null;
 }
 return cv;
}

function drawCurrentGoldFrame(now){
 if(GOLD_LOOP.state!=='ready'||!GOLD_LOOP.frames.length)return 0;
 var slots=document.querySelectorAll('.gold-slot');
 if(!slots.length)return 0;
 now=now===undefined?performance.now():now;
 var playback=getGoldPlayback(now),elapsed=Math.max(0,now-GOLD_LOOP.startedAt);
 var key=playback.first+':'+playback.second+':'+Math.round(playback.mix*255)+':'+Math.floor(elapsed/33.333333);
 if(GOLD_LOOP.lastDraw!==key){
  var surfaceCtx=GOLD_LOOP.surface.getContext('2d');
  if(!surfaceCtx)return slots.length;
  surfaceCtx.globalAlpha=1;
  surfaceCtx.drawImage(GOLD_LOOP.frames[playback.first].bmp,0,0,GOLD_LOOP.w,GOLD_LOOP.h);
  if(playback.mix>0){
   surfaceCtx.globalAlpha=playback.mix;
   surfaceCtx.drawImage(GOLD_LOOP.frames[playback.second].bmp,0,0,GOLD_LOOP.w,GOLD_LOOP.h);
   surfaceCtx.globalAlpha=1;
  }
  drawGoldConfetti(surfaceCtx,elapsed);
  GOLD_LOOP.lastDraw=key;
 }
 for(var i=0;i<slots.length;i++){
  var slot=slots[i];
  var cv=slot.querySelector('canvas.gold-canvas');
  if(!cv){
   cv=getPooledCanvas();
  }
  if(cv.width!==GOLD_LOOP.w || cv.height!==GOLD_LOOP.h){
   cv.width=GOLD_LOOP.w;
   cv.height=GOLD_LOOP.h;
   cv._lastDraw=null;
  }
  if(cv._lastDraw!==key){
   var ctx=cv.getContext('2d');
   if(ctx){
    ctx.drawImage(GOLD_LOOP.surface,0,0,GOLD_LOOP.w,GOLD_LOOP.h);
    cv._lastDraw=key;
   }
   else continue;
  }
  if(!cv.parentNode)slot.appendChild(cv);
  if(!slot.classList.contains('has-canvas')){
   slot.classList.add('has-canvas');
  }
 }
 return slots.length;
}

function syncGoldCanvases(){
 if(typeof HemicycleLegendaryConfetti!=='undefined')HemicycleLegendaryConfetti.sync();
 if(GOLD_LOOP.state!=='ready'||!GOLD_LOOP.frames.length)return;
 var count=drawCurrentGoldFrame(performance.now());
 if(count>0)startGoldRaf();
}

function startGoldRaf(){
 if(GOLD_LOOP.rafId)return;
 var tick=function(now){
  var activeCount=drawCurrentGoldFrame(now);
  if(activeCount>0){
   GOLD_LOOP.rafId=requestAnimationFrame(tick);
  } else {
   GOLD_LOOP.rafId=null;
  }
 };
 GOLD_LOOP.rafId=requestAnimationFrame(tick);
}

function isFrameValid(sampleCtx, sampleW, sampleH, sourceCanvas){
 try{
  sampleCtx.clearRect(0,0,sampleW,sampleH);
  sampleCtx.drawImage(sourceCanvas,0,0,sampleW,sampleH);
  var data=sampleCtx.getImageData(0,0,sampleW,sampleH).data;
  var totalPixels=sampleW*sampleH;
  var opaqueCount=0,lumaSum=0;
  for(var i=0;i<data.length;i+=4){
   var a=data[i+3];
   if(a>40){
    opaqueCount++;
    lumaSum+=(data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
   }
  }
  if(opaqueCount < totalPixels*0.35)return false;
  var avgLuma=lumaSum/opaqueCount;
  if(avgLuma < 6)return false;
  return true;
 }catch(e){
  return true;
 }
}

function readGoldFrames(buffer){
 var bytes=new Uint8Array(buffer),view=new DataView(buffer),frames=[],bodies=[],width=0,height=0;
 function tag(at){return String.fromCharCode(bytes[at],bytes[at+1],bytes[at+2],bytes[at+3]);}
 function uint24(at){return bytes[at]|(bytes[at+1]<<8)|(bytes[at+2]<<16);}
 if(bytes.length<12 || tag(0)!=='RIFF' || tag(8)!=='WEBP')throw new Error('Invalid golden WebP');
 for(var pos=12;pos+8<=bytes.length;){
  var kind=tag(pos),size=view.getUint32(pos+4,true),start=pos+8,end=start+size;
  if(end>bytes.length)throw new Error('Incomplete golden WebP');
  if(kind==='VP8X' && size>=10){width=uint24(start+4)+1;height=uint24(start+7)+1;}
  if(kind==='ANMF'){
   if(size<16 || !width || !height)throw new Error('Invalid golden frame');
   var fw=uint24(start+6)+1,fh=uint24(start+9)+1;
   // Every frame is a complete portrait, including the neutral first frame.
   if(uint24(start)!==0 || uint24(start+3)!==0 || fw!==width || fh!==height || !(bytes[start+15]&2)){
    throw new Error('Golden frame requires composition');
   }
   {
    var body=bytes.slice(start+16,end),bodyView=new DataView(body.buffer),alpha=false;
    for(var sub=0;sub+8<=body.length;){
     var subSize=bodyView.getUint32(sub+4,true);
     if(sub+8+subSize>body.length)throw new Error('Incomplete golden frame');
     if(body[sub]===65 && body[sub+1]===76 && body[sub+2]===80 && body[sub+3]===72)alpha=true;
     sub+=8+subSize+(subSize&1);
    }
    var header=new Uint8Array(alpha?30:12),headerView=new DataView(header.buffer);
    header.set([82,73,70,70],0);headerView.setUint32(4,header.length+body.length-8,true);
    header.set([87,69,66,80],8);
    if(alpha){
     header.set([86,80,56,88,10,0,0,0,16,0,0,0],12);
     for(var b=0;b<3;b++){header[24+b]=((width-1)>>(b*8))&255;header[27+b]=((height-1)>>(b*8))&255;}
    }
    var identity=-1;
    for(var ci=0;ci<bodies.length;ci++){
     if(bodies[ci].length!==body.length)continue;
     var same=true;for(var bi=0;bi<body.length;bi++)if(bodies[ci][bi]!==body[bi]){same=false;break;}
     if(same){identity=ci;break;}
    }
    if(identity<0){identity=bodies.length;bodies.push(body);}
    frames.push({identity:identity,blob:new Blob([header,body],{type:'image/webp'}),dur:uint24(start+12)||56,w:width,h:height});
   }
  }
  pos=end+(size&1);
 }
 if(!frames.length)throw new Error('No golden portrait frames');
 return frames;
}

function loadGoldImage(blob){
 return new Promise(function(resolve,reject){
  var img=new Image(),url=URL.createObjectURL(blob);
  img.onload=function(){URL.revokeObjectURL(url);resolve(img);};
  img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('Cannot decode golden frame'));};
  img.src=url;
 });
}

function decodeGoldFrame(blob){
 if(typeof createImageBitmap==='function'){
  return createImageBitmap(blob).catch(function(){return loadGoldImage(blob);});
 }
 return loadGoldImage(blob);
}

function ensureGoldLoop(){
 if(GOLD_LOOP.state==='ready'){
  syncGoldCanvases();
  return;
 }
 if(GOLD_LOOP.state!=='idle')return;
 GOLD_LOOP.state='loading';
 var loaded=[],portrait=null;
 // A new URL also bypasses copies retained by the previous service worker.
 var url=ART_BASE+'donald-trump-golden.webp?v=nod-60';
 GOLD_LOOP.posterUrl=ART_BASE+'donald-trump-golden-portrait.webp?v=nod-60';
 var portraitReady=fetch(GOLD_LOOP.posterUrl,{cache:'force-cache'}).then(function(res){
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.blob();
 }).then(decodeGoldFrame).then(function(bmp){

(function initSwipeGestures(){
 var sx=0,sy=0,dx=0,dy=0,tracking=false,lockedHoriz=false;

 function applyDragTransform(offsetX){
  var det=document.getElementById('detalleSwipe');
  var zWrap=document.getElementById('zoomCardWrap');
  var clamped=Math.max(-140,Math.min(140,offsetX));
  var op=Math.max(0.55, 1 - Math.abs(clamped)/260);
  if(det){
   det.style.transition='none';
   det.style.transform='translateX('+(clamped*0.65)+'px)';
   det.style.opacity=op;
  }
  if(zWrap){
   zWrap.style.transition='none';
   zWrap.style.transform='translateX('+clamped+'px) rotate('+(clamped*0.035)+'deg)';
   zWrap.style.opacity=op;
  }
 }

 function resetDragTransform(){
  var det=document.getElementById('detalleSwipe');
  var zWrap=document.getElementById('zoomCardWrap');
  if(det){
   det.style.transition='transform .18s ease, opacity .18s ease';
   det.style.transform='';
   det.style.opacity='';
  }
  if(zWrap){
   zWrap.style.transition='transform .18s ease, opacity .18s ease';
   zWrap.style.transform='';
   zWrap.style.opacity='';
  }
 }

 function canStartSwipe(target){
  if(SCREEN!=='detalle')return false;
  if(MODAL_CB)return false;
  if(ZOOM_OPEN)return true;
  if(target && target.closest && target.closest('#detalleSwipe'))return true;
  return false;
 }

 function onStart(x,y,target){
  if(!canStartSwipe(target))return;
  sx=x;sy=y;dx=0;dy=0;
  tracking=true;
  lockedHoriz=false;
 }

 function onMove(x,y,ev){
  if(!tracking)return;
  dx=x-sx;
  dy=y-sy;
  if(!lockedHoriz){
   if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.25){
    lockedHoriz=true;
   } else if(Math.abs(dy)>18 && Math.abs(dy)>Math.abs(dx)){
    tracking=false;
    resetDragTransform();
    return;
   }
  }
  if(lockedHoriz){
   if(ev && ev.cancelable)ev.preventDefault();
   applyDragTransform(dx);
  }
 }

 function onEnd(){
  if(!tracking)return;
  tracking=false;
  if(lockedHoriz && Math.abs(dx)>=42){
   SWIPE_BLOCK_CLICK=Date.now()+320;
   var step=(dx<0)?1:-1;
   if(!cycleDetalleCard(step)){
    resetDragTransform();
   }
  } else {
   if(lockedHoriz)SWIPE_BLOCK_CLICK=Date.now()+220;
   resetDragTransform();
  }
  lockedHoriz=false;
 }

 function cancelTouchSwipe(){tracking=false;lockedHoriz=false;resetDragTransform();}

 document.addEventListener('touchstart',function(ev){
  if(!ev.touches||ev.touches.length!==1){cancelTouchSwipe();return;}
  onStart(ev.touches[0].clientX,ev.touches[0].clientY,ev.target);
 },{passive:true});

 document.addEventListener('touchmove',function(ev){
  if(!ev.touches||ev.touches.length!==1){cancelTouchSwipe();return;}
  if(!tracking)return;
  onMove(ev.touches[0].clientX,ev.touches[0].clientY,ev);
 },{passive:false});

 document.addEventListener('touchend',onEnd,{passive:true});
 document.addEventListener('touchcancel',cancelTouchSwipe,{passive:true});

 document.addEventListener('mousedown',function(ev){
  if(ev.button!==0)return;
  onStart(ev.clientX,ev.clientY,ev.target);
 },false);

 document.addEventListener('mousemove',function(ev){
  if(!tracking)return;
  onMove(ev.clientX,ev.clientY,ev);
 },false);

 document.addEventListener('mouseup',onEnd,false);
})();

document.addEventListener('keydown',function(e){
 var dialog=document.querySelector('#modalRoot .objective-modal');if(!dialog)return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeModal();return;}
 var tabs=Array.prototype.slice.call(dialog.querySelectorAll('.objective-tabs button')),at=tabs.indexOf(document.activeElement);
 if(at>=0&&['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>=0){e.preventDefault();e.stopImmediatePropagation();var next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();return;}
 if(e.key==='Tab'){var buttons=Array.prototype.slice.call(dialog.querySelectorAll('button:not(:disabled):not([hidden])')),index=buttons.indexOf(document.activeElement);if(index<0||e.shiftKey&&index===0||!e.shiftKey&&index===buttons.length-1){e.preventDefault();buttons[e.shiftKey?buttons.length-1:0].focus();}}

  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-buid]')){ev.preventDefault();ev.target.click();return;}
 }
 if(PLAY_OPEN&&ev.key==='Escape'){ev.preventDefault();PLAY_OPEN=false;paint();var toggle=document.querySelector('[data-act="play-menu"]');if(toggle)toggle.focus();return;}
 if(PLAY_OPEN&&(ev.key==='ArrowUp'||ev.key==='ArrowDown')){
  ev.preventDefault();var items=Array.prototype.slice.call(document.querySelectorAll('.play-option')),index=items.indexOf(document.activeElement);if(items.length)items[(index+(ev.key==='ArrowDown'?1:items.length-1))%items.length].focus();return;
 }
 var modal=document.getElementById('modalRoot');
 if(modal&&modal.firstChild&&ev.key==='Tab'){
  var controls=Array.prototype.slice.call(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled)'));
  var at=controls.indexOf(document.activeElement);
  if(controls.length&&((ev.shiftKey&&at<=0)||(!ev.shiftKey&&(at<0||at===controls.length-1)))){ev.preventDefault();controls[ev.shiftKey?controls.length-1:0].focus();}return;
 }
 if(ev.key==='Escape'){
  if(ZOOM_OPEN){closeZoom();return;}
  closeModal();
  return;
 }
 if(SCREEN==='detalle' && !MODAL_CB){
  if(ev.key==='ArrowRight')cycleDetalleCard(1);
  else if(ev.key==='ArrowLeft')cycleDetalleCard(-1);
 }
});

var RANKS=[[0,'Aprendiz de pasillo'],[2500,'Concejal'],[5000,'Diputado'],[7500,'Portavoz'],[10000,'Ministro'],[12500,'Presidente']];
function rankName(e){if(typeof HemicycleRanked!=='undefined')return HemicycleRanked.position(e).label;var n=RANKS[0][1];for(var i=0;i<RANKS.length;i++)if(e>=RANKS[i][0])n=RANKS[i][1];return n;}
function copies(d,id){var album=BYID[id]&&BYID[id].action?(d.actionAlbum||[]):d.album,n=0;for(var i=0;i<album.length;i++)if(album[i]===id)n++;return n;}
function uniqueAlbum(d){var m={},out=[];d.album.forEach(function(id){m[id]=(m[id]||0)+1;});Object.keys(m).forEach(function(id){if(BYID[id])out.push({id:id,c:BYID[id],n:m[id]});});return out;}

function syncRankedSeason(){
 if(typeof HemicycleRanked==='undefined')return null;
 var d=D(),saved=lsGet(HemicycleRanked.key),result=HemicycleRanked.sync(saved,d.elo,Date.now());
 if(result.elo!==d.elo){d.elo=result.elo;var changes={};changes[LS]=d;changes[HemicycleRanked.key]=result.state;atomicLocal(changes);}
 else if(JSON.stringify(saved)!==JSON.stringify(result.state)){var changes={};changes[HemicycleRanked.key]=result.state;atomicLocal(changes);}
 return result;
}
function atomicLocal(values){
 if(values[LS])values[LS].objectives=HemicycleObjectives.snapshot(Object.assign({},values[LS],{objectiveCatalog:CARDS}),CARDS);
 var before={};Object.keys(values).forEach(function(k){before[k]=localStorage.getItem(k);});
 try{Object.keys(values).forEach(function(k){if(values[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(values[k]));});}
 catch(e){Object.keys(before).forEach(function(k){try{if(before[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,before[k]);}catch(ignore){}});throw new Error('No se han podido guardar los cambios. Comprueba el espacio del navegador.');}
 localSaved();
}
function claimRankedReward(id){

  var state=syncRankedSeason().state,result=HemicycleRanked.claim(state,id),cards=packContents(result.reward.kind),d=D();
  awardCards(d,cards.map(function(c){return c.id;}));var values={};values[LS]=d;values[HemicycleRanked.key]=result.state;atomicLocal(values);
  go('sobre',{cards:cards.map(function(c){return c.id;}),k:result.reward.kind,free:true,from:'buzon'});gameSound('reward');
 };
 return Promise.resolve().then(function(){if(navigator.locks)return navigator.locks.request('hemicycle-market-sale',claim);return claim();}).catch(function(e){showModal('No se ha reclamado el sobre',e.message,'Entendido',false,null);});

function packCountdown(left){
 var seconds=Math.max(0,Math.ceil(left/1000));
 if(seconds>=86400)return Math.floor(seconds/86400)+'d '+Math.floor(seconds%86400/3600)+'h';
 if(seconds>=3600)return Math.floor(seconds/3600)+'h '+Math.floor(seconds%3600/60)+'m';
 if(seconds>=60)return Math.floor(seconds/60)+'m '+seconds%60+'s';
 return seconds+'s';
}

function calcRankedEloDelta(who, pVotes, eVotes, abandoned){
 if(who!=='p'&&who!=='e')return 0;
 if(who==='e'&&abandoned)return -18;
 var winner=who==='p'?pVotes:eVotes,loser=who==='p'?eVotes:pVotes;
 var margin=Math.max(0,Math.min(1,(winner-loser)/Math.max(1,winner)));
 /* +25 al dejar al rival con un cuarto de tus votos; -18 solo sin votos o por abandono. */
 return who==='p'?10+Math.floor(15*Math.min(1,margin/0.75)):-5-Math.floor(13*margin);
}

  else go('result',{tutorial:true,completed:who==='p'&&!abandoned});

 if(who==='p'){
  fs=mode==='normal'?rnd(20,50):rnd(50,100);
  d.w++;
  if(typeof HemicycleMastery!=='undefined'&&G.leader&&G.leader.p&&HemicycleMastery.eligible(G.leader.p.k))d.leaderMastery=HemicycleMastery.recordWin(d,G.leader.p.k);
  if(mode==='ranked'){
   eloDelta=calcRankedEloDelta('p', G.votes.p, G.votes.e, false);

function chooseBattleAction(s){
 if(!G||G.over||G.side!==s)return null;
 var foe=s==='p'?'e':'p';
 var actionCard=G.hand[s].filter(function(c){if(!c.action)return false;var a=BYID[c.k],targets=localActionTargets(s,a),target=(a.target==='self'||a.target==='rival')&&targets.length?targets[0].card.uid:undefined;return !localActionReason(s,c,target);})[0];if(actionCard){var spell=BYID[actionCard.k],available=localActionTargets(s,spell),target=(spell.target==='self'||spell.target==='rival')&&available.length?available[0].card.uid:undefined;return {type:'spell',card:actionCard,target:target};}
 /* Presentar al Líder permite activar la doctrina y responder al cruce rival. */
 if(G.field[s].length<3){
  var playable=G.hand[s].filter(function(c){return !c.action&&c.c<=G.tdp[s];}).sort(function(a,b){
   var aLead=(G.leader[s]&&a.uid===G.leader[s].uid)?1:0;
   var bLead=(G.leader[s]&&b.uid===G.leader[s].uid)?1:0;
   return (bLead-aLead)||(b.v-a.v)||(b.c-a.c);
  });
  if(playable.length)return {type:'play',card:playable[0]};
 }
 var readyAtk=G.field[s].filter(function(c){return c.ready;});
 if(readyAtk.length){
  var atk=readyAtk[0],power=canStrongAttack(s,atk)?'strong':'normal';
  var tgt='__EMPTY';
  if(G.field[foe].length){
   var sortedT=G.field[foe].slice().sort(function(x,y){
    var protectedDoc=activeDoc(foe)==='aforado';
    var killX=(x.h<=incomingDamage(x,attackDamage(s,atk,x,power))&&!(protectedDoc&&!G.saved[x.uid]))?1:0;
    var killY=(y.h<=incomingDamage(y,attackDamage(s,atk,y,power))&&!(protectedDoc&&!G.saved[y.uid]))?1:0;
    if(killX!==killY)return killY-killX;
    if(doc(s)&&!activeDoc(s)){
     var leadX=x.uid===G.leader[foe].uid?1:0,leadY=y.uid===G.leader[foe].uid?1:0;
     if(leadX!==leadY)return leadY-leadX;
    }
    return (y.v-x.v)||(x.h-y.h);
   });
   tgt=sortedT[0];
  }
  var canExpel=tgt!=='__EMPTY'&&tgt.h<=incomingDamage(tgt,attackDamage(s,atk,tgt,power))&&!(activeDoc(foe)==='aforado'&&!G.saved[tgt.uid]);
  if(!canExpel){
   var threat=0;
   G.field[foe].forEach(function(c){threat=Math.max(threat,attackDamage(foe,c,atk,canStrongAttack(foe,c,(G.turns?G.turns[foe]:0)+1)?'strong':'normal'));});
   // No insiste siempre en curarse si ni la cura basta frente al peor golpe posible.
   // Alterna presión y apoyo en ese caso incierto, sin bonificaciones ocultas.
   if(atk.h<=Math.ceil(atk.hm/2)&&canHeal(s,atk)&&(atk.h+healingAmount(atk)>threat||Math.random()<0.5))return {type:'heal',card:atk};
   if(!atk.guard&&threat>=atk.h&&Math.ceil(threat/2)<atk.h)return {type:'guard',card:atk};
  }
  var variant=tgt!=='__EMPTY'&&tgt.h<=incomingDamage(tgt,attackDamage(s,atk,tgt,'normal'))?'normal':power;
  return {type:'attack',card:atk,target:tgt,variant:variant};
 }
 return {type:'end'};
}

var LNAMES=['Grupo Nacional','Bancada Popular','Unión Cívica','Frente Común','Alianza Soberana','Grupo Liberal','Coalición Verde','Bloque Regional','Partido del Centro','Grupo Independiente','Unión Patriótica','Frente Amplio','Grupo Federal','Nueva Bancada','Coalición Cívica','Bloque Obrero','Grupo Democrático','Unión Progresista','Frente Nacional','Grupo Social','Alianza Popular','Bloque Ciudadano','Grupo Reformista','Unión Democrática','Frente Cívico','Grupo del Norte','Bancada del Sur','Alianza Federal','Grupo Radical','Frente del Centro'];
var LEAGUE_NAMES={};LNAMES.forEach(function(n){LEAGUE_NAMES[searchText(n)]=n;});
function leagueName(n){return LEAGUE_NAMES[searchText(n)]||n;}
function ligaNew(div){
 var teams=LNAMES.slice(0,30).map(function(n){return {n:n,pts:0,w:0,d:0,l:0,you:false,str:rnd(30,80)};});
 teams[0].you=true;teams[0].n='Tu grupo';teams[0].str=60;
 return {div:div||3,jor:1,temp:1,teams:teams};
}
function ligaLoad(){return lsGet(LS2);}
function ligaResult(who,info){
 var lg=ligaLoad();
 if(!lg){go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga'});return;}
 var me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
 if(!me){go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga'});return;}
 if(who==='p'){me.pts+=3;me.w++;}else if(who==='e'){me.l++;}else{me.pts+=1;me.d++;}
 simRound(lg,me);
 lg.jor++;
 if(lg.jor>12){seasonEnd(lg,info);return;}
 lsSet(LS2,lg);
 go('result',{who:who,msg:info.msg,fs:info.fs,won:info.won,lost:info.lost,mode:'liga',liga:true});
}
function simRound(lg,me){
 var others=shuffle(lg.teams.filter(function(t){return t!==me;}));
 for(var i=0;i<others.length-1;i+=2){
  var a=others[i],b=others[i+1],ra=a.str+rnd(0,30),rb=b.str+rnd(0,30);
  if(ra>rb){a.pts+=3;a.w++;b.l++;}else if(rb>ra){b.pts+=3;b.w++;a.l++;}else{a.pts++;b.pts++;a.d++;b.d++;}
 }
}
function seasonEnd(lg,info){
 var d=D(),me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
 var sorted=lg.teams.slice().sort(function(a,b){return b.pts-a.pts||b.w-a.w;});
 var pos=sorted.indexOf(me)+1,reward=rnd(700,1100);
 d.fs+=reward;saveD(d);
 var nd=lg.div;if(pos<=5&&lg.div>1)nd=lg.div-1;else if(pos>25&&lg.div<3)nd=lg.div+1;
 var nm=function(x){return x===1?'Primera':(x===2?'Segunda':'Tercera');};
 var msg=info.msg+' Terminas '+pos+'º de 30 en '+nm(lg.div)+' con '+me.pts+' puntos. Recompensa de fin de temporada: +'+reward+' FS. ';
 msg+=nd<lg.div?('¡ASCENSO a '+nm(nd)+'!'):(nd>lg.div?('DESCENSO a '+nm(nd)+'.'):'Mantienes la categoría.');
 var fresh=ligaNew(nd);fresh.temp=lg.temp+1;lsSet(LS2,fresh);
 go('result',{who:'season',msg:msg,fs:info.fs+reward,won:info.won,lost:info.lost,mode:'liga',season:true});
}

SCREENS.ayuda=function(){
 var html='<div class="help-heading"><span class="eyebrow">A TU RITMO</span><h2>Ayuda</h2><p class="sub">Abre el tema que quieras consultar o practica con las guías.</p></div><div class="inner-scroll help-topics">'
 +'<div class="panel"><h3>Combate guiado</h3><p class="sub">Practica paso a paso sin arriesgar cromos ni modificar tu progreso.</p><button class="btn sm" data-act="tutorial">Tutorial de combate</button><button class="btn ghost sm" data-act="menu-tutorial">Guía del menú</button></div>'
 +'<div class="panel"><h3>El debate · Objetivo y tiempo</h3><p class="sub">Cara o cruz decide quién empieza: tú tienes cara y el rival, cruz. Cada ronda incluye un turno de cada jugador. Alcanza 100 votos para ganar inmediatamente, sin esperar al rival. No hay límite de rondas: Normal y Clasificatoria disponen de 90 segundos por turno; Rápida, de 60. Durante ese tiempo puedes realizar tus acciones y pasar. Agotar el tiempo supone abandonar por inactividad. Cada turno ganas 3 votos base más los escaños de tus oradores en la Tribuna. Expulsar a un orador rival suma sus escaños a tu marcador.</p></div>'
 +'<div class="panel"><h3>Tu gabinete y su líder</h3><p class="sub">Desde Colección puedes guardar cinco gabinetes favoritos y elegir su líder. Antes del combate seleccionas uno de ellos; sus integrantes solo se editan en Colección. Alineas <b>5 cromos distintos</b>. Hay tres huecos en la Tribuna y un máximo de dos cartas en la mano; las demás esperan en el mazo. Al comenzar cada turno propio, las cartas sin usar vuelven al mazo y se roban hasta dos al barajar. Nunca pueden coincidir dos acciones en la mano. Un expulsado no puede volver en tu siguiente turno propio; después se baraja con el mazo pendiente antes de poder ser robado. Tu Líder empieza siempre en tu mano inicial con +1 Zasca y +3 Aguante, y mientras esté en la Tribuna activa su Doctrina.</p></div>'
 +'<div class="panel"><h3>Las tres frases de cada cromo</h3><p class="sub">Toca un orador de tu Tribuna para abrir sus tres frases. Cada cromo dispone de una acción por turno, sin coste adicional de TdP. La primera frase ataca con su Zasca vigente; la segunda causa el 150 %, redondeado hacia arriba. El fuerte está disponible solo en el tercer turno propio del cromo en mesa y después cada tres turnos: 3, 6, 9… Si lo dejas pasar, la oportunidad caduca. Cuesta 1 de Aguante y requiere al menos 2 para ejecutarlo. El ciclo es individual y se reinicia al salir y volver a entrar.</p><p class="sub">La tercera frase cambia el contenido de esa misma ventana para escoger <b>Defensa</b> o <b>Curación</b>. La defensa reduce a la mitad el próximo golpe recibido por ese cromo y después desaparece; si no recibe golpes, caduca al comenzar tu siguiente turno. No se acumula. La curación restaura la mitad del Aguante perdido, con un mínimo de 3 y sin superar el máximo. Tras curarse, ese cromo debe dejar pasar un turno propio completo antes de volver a curarse; puede atacar o defender durante ese descanso. Esta restricción no afecta a la curación automática de Foco. El daño recibido tras defender y la curación se redondean hacia arriba. La IA sigue estas mismas reglas.</p></div>'
 +'<div class="panel"><h3>Debilidades circulares</h3><p class="sub">Con ambos líderes en la Tribuna, cada doctrina neutraliza a una rival. Las demás siguen activas. Al salir el líder que la contrarresta, la doctrina se recupera. Los efectos ya resueltos no se deshacen; la bonificación de Vieja Guardia solo se aplica mientras su doctrina esté activa.</p>'
 +DOCS.map(function(d){return '<p class="sub" style="margin-top:4px"><b>'+esc(d.n)+'</b> — '+esc(doctrineMatchup(d.k))+'</p>';}).join('')+'</div>'
 +'<div class="panel"><h3>Elo · Puntuación y dificultad</h3><p class="sub">Los cromos rivales nunca inflan sus estadísticas. En Clasificatoria ganas de <b>+10 a +25 Elo</b> y pierdes de <b>5 a 18 Elo</b> según la diferencia proporcional de votos, sin importar quién empieza ni la ronda final. Un resultado ajustado cambia menos Elo. Ganas +25 si el rival termina con una cuarta parte de tus votos o menos (por ejemplo, 100 a 25). Solo pierdes 18 si acabas sin votos o abandonas. Un empate mantiene tu Elo, que nunca baja de cero.</p></div>'
 +rankedPanel()
 +'<div class="panel"><h3>Cartas de acción</h3><p class="sub">Se consiguen en los mismos sobres y se consultan con el botón Oradores/Acciones de Colección. Cada gabinete puede añadir hasta dos acciones distintas. Toca una acción en la mano para leer efecto, coste, objetivos y requisitos antes de activarla. Solo se utiliza una por turno. No ocupa hueco de orador: se activa, muestra su animación y regresa al mazo; las de un solo uso quedan en un descarte sombreado.</p></div>'
 +'<div class="panel"><h3>Botín y protección de la colección</h3><p class="sub">En Clasificatoria y Liga, el ganador arrebata un cromo rival y el perdedor cede una copia (protegiéndose siempre tus 5 últimos políticos únicos).</p></div>'
 +'<div class="panel"><h3>Mercado · Ventas e intercambios</h3><p class="sub">Desde Mercado puedes vender uno o varios repetidos y conservar una copia de cada cromo. Entre jugadores se necesita una conexión al servidor. Los intercambios solo admiten rarezas iguales o consecutivas. Cada jugador revisa los datos, marca el tick y confirma en una sola ventana; la entrega se realiza cuando ambos aceptan.</p></div>'
 +backupPanel()
 +'<div class="panel"><h3>Tu progreso</h3><p class="sub">'+D().w+' victorias · '+D().l+' derrotas · '+D().fs+' FS.</p><button class="btn ghost sm" style="margin-top:8px" data-act="reset">Borrar progreso</button></div>'
 +'</div><button class="btn wide sm" data-go="menu">Volver al menú</button>';
 return html.replace(/<(div|section) class="panel(?: [^"]*)?"><h3>([\s\S]*?)<\/h3>([\s\S]*?)<\/\1>/g,function(all,tag,title,body){return '<details class="help-section"'+(title==='Combate guiado'?' open':'')+'><summary><span>'+title+'</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></summary><div class="help-body">'+body+'</div></details>';});
};

document.addEventListener('click',function(ev){
 var t=ev.target;
 var root=document.getElementById('app')||document.body;
 if(!root.contains(t)||!t.closest)return;

 if(t.closest('#coinRoot [data-act="begin"]')){beginDebate();return;}
 if(t.closest('#coinRoot'))return;

 /* 1. Gestión prioritaria de los botones de confirmación / cancelación del Modal */
 var mBtn=t.closest('button[data-modal]');
 if(mBtn){
  if(mBtn.disabled)return;
  var mAct=mBtn.getAttribute('data-modal');
  var review=document.querySelector('#modalRoot [data-modal="review"]');
  if(mAct==='review'){
   var checked=mBtn.getAttribute('aria-pressed')!=='true';
   mBtn.setAttribute('aria-pressed',String(checked));mBtn.classList.toggle('is-reviewed',checked);
   var confirm=document.querySelector('#modalRoot [data-modal="confirm"]');if(confirm)confirm.disabled=!checked||confirm.dataset.valid==='false';
   return;
  }
  if(mAct==='confirm'&&review&&review.getAttribute('aria-pressed')!=='true')return;
  var cb=MODAL_CB;
  closeModal();
  if(mAct==='confirm' && typeof cb==='function')cb();
  return;
 }
 if(t.getAttribute('data-modal')==='bg'){
  closeModal();
  return;
 }
 var objectiveAction=t.closest('.objective-modal [data-act]');if(objectiveAction&&!objectiveAction.disabled){if(objectiveAction.getAttribute('data-act')==='objective-tab')openObjectives(objectiveAction.getAttribute('data-view'),objectiveAction.getAttribute('data-tab'));else if(objectiveAction.getAttribute('data-act')==='objective-claim')claimObjective(objectiveAction);return;}
 if(t.closest('.modal'))return;

 if(PLAY_OPEN&&!t.closest('.play-launcher')){PLAY_OPEN=false;var options=document.getElementById('playOptions');if(options)options.remove();var toggle=document.querySelector('[data-act="play-menu"]');if(toggle)toggle.setAttribute('aria-expanded','false');}
 var marketButton=t.closest('[data-market]');
 if(marketButton){try{market().handle(marketButton);}catch(e){market().state.error=e.message;paint();}return;}

 if(Date.now() < SWIPE_BLOCK_CLICK){
  ev.preventDefault();
  ev.stopPropagation();
  return;
 }

 if(ZOOM_OPEN && t.closest('#zoomBg')){
  closeZoom();
  return;
 }

 var n=t.closest('[data-action-pick],[data-baction],[data-go],[data-act],[data-lead],[data-pick],[data-card],[data-buid],[data-fr],[data-fd]');
 if(!n||n.disabled)return;
 if(n.hasAttribute('data-baction')){
  var choice=n.getAttribute('data-baction'),game=G,selected=G&&G.sel;
  if(typeof HemicycleBattleActions!=='undefined'&&n.closest('#battleActionRoot'))HemicycleBattleActions.select(n,function(){if(G===game&&G.sel===selected)choosePlayerAction(choice);});
  else choosePlayerAction(choice);
  return;
 }

 if(n.hasAttribute('data-fr')){
  FIL.r=n.getAttribute('data-fr');
  updateColeccionInPlace();
  return;
 }
 if(n.hasAttribute('data-fd')){
  FIL.d=n.getAttribute('data-fd');
  updateColeccionInPlace();
  return;
 }

 if(n.hasAttribute('data-lead')){
  if(SCREEN!=='coleccion'||CABINET_EDIT===null)return;
  var lid=n.getAttribute('data-lead');
  if(BUILD.ids.indexOf(lid)<0){
   if(BUILD.ids.length<5)BUILD.ids.push(lid);
   else BUILD.ids[4]=lid;
  }
  BUILD.leader=lid;
  paint();return;
 }

 if(n.hasAttribute('data-action-pick')){if(SCREEN==='coleccion'&&CABINET_EDIT!==null){var actionId=n.getAttribute('data-action-pick');if(!BUILD.actions)BUILD.actions=[];var actionIndex=BUILD.actions.indexOf(actionId);if(actionIndex>=0)BUILD.actions.splice(actionIndex,1);else if(BUILD.actions.length<2)BUILD.actions.push(actionId);else showModal('Dos acciones como máximo','Quita una acción del gabinete antes de añadir otra.','Entendido',false,null);paint();}return;}
 if(n.hasAttribute('data-pick')){
  if(SCREEN!=='coleccion'||CABINET_EDIT===null)return;
  var pid=n.getAttribute('data-pick'),ix=BUILD.ids.indexOf(pid);
  if(ix>=0){
   BUILD.ids.splice(ix,1);
   if(BUILD.leader===pid)BUILD.leader=BUILD.ids[0]||null;
  } else if(BUILD.ids.length<5){
   BUILD.ids.push(pid);
  } else {
   var oldId=BUILD.ids[4];
   BUILD.ids[4]=pid;
   if(BUILD.leader===oldId)BUILD.leader=pid;
  }
  if(!BUILD.leader&&BUILD.ids.length)BUILD.leader=BUILD.ids[0];
  paint();return;
 }

 if(n.hasAttribute('data-buid')){
  var uid=n.getAttribute('data-buid'),side=n.getAttribute('data-side');
  if(checkBattleEnd()||G.side!=='p'||G.networkBusy)return;
  var i;
  if(LOCAL_ACTION_TARGET){if(enMano('p',uid)){inspectLocalAction(uid);return;}selectLocalActionTarget(uid);return;}
  if(enMano('p',uid)){
   var selectedHand=G.hand.p.filter(function(c){return c.uid===uid;})[0];if(selectedHand&&selectedHand.action){inspectLocalAction(uid);return;}
   var cardKey=uidOf(uid);
   if(G.field.p.length>=3){
    gameSound('error');log('Tu Tribuna ya tiene el máximo de 3 oradores.');
   } else if(!playCard('p',uid)){
    gameSound('error');log('No te llega el Tiempo de Palabra para presentar a '+(BYID[cardKey]?BYID[cardKey].n:'este orador')+'.');
   }
   paint();return;
  }
  if(side==='e'){
   if(!G.sel||!G.move){log('Elige un orador tuyo y después una de sus dos frases de ataque.');paint();return;}
   var atk=null,tgt=null;
   for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===G.sel)atk=G.field.p[i];
   for(i=0;i<G.field.e.length;i++)if(G.field.e[i].uid===uid)tgt=G.field.e[i];
   if(!tgt)tgt='__EMPTY';
   if(atk&&atk.ready){attack(atk,tgt,'p',G.move);G.sel=null;G.move=null;paint();}
   return;
  }
  var own=null;
  for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===uid)own=G.field.p[i];
  if(own){
   if(!own.ready){gameSound('error');log(own.n+' ya ha intervenido en este turno.');paint();return;}
   G.sel=(G.sel===uid&&!G.move)?null:uid;G.move=null;G.support=false;paint();
  }
  return;
 }

 if(n.hasAttribute('data-card')&&SCREEN==='coleccion'){
  LAST_SWIPE_DIR='';
  go('detalle',{id:n.getAttribute('data-card')});return;
 }

 var act=n.getAttribute('data-act'),dest=n.getAttribute('data-go');
 if(dest){
  if(dest==='builder'){
   SO={mode:n.getAttribute('data-mode')||'normal'};
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader,actions:(LAST_BUILD.actions||[]).slice()};
   sanitizeBuild();
  }
  if(dest==='tienda')FIL={q:'',r:'',d:''};
  if(dest==='battle'&&!G)return;
  go(dest);return;
 }
 if(!act)return;

 switch(act){
  case 'challenges':openObjectives('challenges');break;
  case 'achievements':openObjectives('achievements');break;
  case 'objective-tab':openObjectives(n.getAttribute('data-view'),n.getAttribute('data-tab'));break;
  case 'objective-claim':claimObjective(n);break;
  case 'pack-reveal':revealPack();break;

   MENU_GUIDE_STATE={colMode:COL_MODE,fil:{q:FIL.q,r:FIL.r,d:FIL.d},game:G,resumeAI:!!AITIMER};clearAI();
   PLAY_OPEN=false;closeZoom();go('menu');
  },
  pause:function(){document.getElementById('screen').dataset.menuTutorial='false';restoreMenuGuideState();},
  action:function(action){
   if(action==='profile-open')PLAYER_PROFILE.openGuide();
   if(action==='profile-close')PLAYER_PROFILE.close();
   if(action==='modes'){PLAY_OPEN=true;paint();}
   if(action==='close-modes'){PLAY_OPEN=false;paint();}
   if(action==='shop'){PLAY_OPEN=false;go('tienda');}
   if(action==='demo-pack'){var examples=CARDS.filter(function(c){return c.r==='comun';}).slice(0,5).map(function(c){return c.id;});go('sobre',{cards:examples,k:'comun',free:true,demo:true});}
   if(action==='demo-reveal')return new Promise(function(resolve){if(!revealPack(resolve))resolve();});
   if(action==='online-demo'){PLAY_OPEN=false;go('menu');ONLINE.openGuide();}
   if(action==='online-close-shop'){ONLINE.close();go('tienda');}
   if(action==='show-actions'){COL_MODE='acciones';FIL={q:'',r:'',d:''};go('coleccion');}
   if(action==='action-card'){var examples=uniqueActions(D());go('detalle',{id:examples.length?examples[0].id:HemicycleActions.cards[0].id});}
   if(action==='back-orators'){COL_MODE='oradores';go('coleccion');}
   if(action==='collection'){COL_MODE='oradores';FIL={q:'',r:'',d:''};go('coleccion');}
   if(action==='card'){var owned=uniqueAlbum(D());go('detalle',{id:owned.length?owned[0].id:CARDS[0].id});}
   if(action==='market')go('mercado');
   if(action==='prices'){var prices=document.querySelector('.market-prices');if(prices)prices.open=true;}
   if(action==='help')go('ayuda');
   if(action==='league')go('liga');
  },
  leave:function(){restoreMenuGuideState();lsSet('hemiciclo_objectives_intro_v1',true);go('menu');}
 }):null;
 document.addEventListener('visibilitychange',syncBattleClock);
 window.addEventListener('pageshow',syncBattleClock);
 document.addEventListener('hemicycle:entry-request',firstEntry);
 document.addEventListener('hemicycle:entered',firstEntry);
 medirInsets();
 try{history.replaceState({s:'menu'},'');}catch(e){}
 var d=D();
 if(d.dtGoldUnlocked&&d.dtGoldActive)ensureGoldLoop();
 paint();
 if(!window.HemicycleLaunchReady){var entry=document.getElementById('launchScreen');if(entry)entry.remove();var app=document.getElementById('app');app.inert=false;app.removeAttribute('aria-hidden');}
 if(window.HemicycleEntryRequested||window.HemicycleEntered)firstEntry();
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v='+encodeURIComponent(VERSION),{updateViaCache:'none'}).catch(function(){});}
}
try{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();}
catch(e){window.onerror(e.message,'boot',0,0);}
})();
</script>
