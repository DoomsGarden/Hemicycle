<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e18">
<meta name="description" content="Colecciona cromos de politicos y gana el debate llegando a 100 votos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hemiciclo: Cara a Cara</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--sat:22px;--sab:12px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#070b16;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:#e9ecf5;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* === ESTRUCTURA FIJA ENTRE APPBAR Y TABBAR === */
.screen{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  touch-action:manipulation;
  background:linear-gradient(180deg,#070b16,#0d1730 60%,#080d18);
  display:flex;
  flex-direction:column;
}
.appbar{
  z-index:29;
  display:flex;
  align-items:center;
  gap:6px;
  padding:calc(var(--sat) + 4px) 12px 7px;
  background:rgba(10,15,28,.98);
  border-bottom:1px solid #1c2440;
  flex-shrink:0;
}
.tabbar{
  z-index:30;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:3px;
  padding:5px 6px calc(var(--sab) + 6px);
  background:rgba(8,12,22,.99);
  border-top:1px solid #1c2440;
  flex-shrink:0;
}
.screen.in-battle .appbar,
.screen.in-battle .tabbar{
  display:none !important;
}
.screen.in-battle .content{
  padding-top:calc(var(--sat) + 6px);
  padding-bottom:calc(var(--sab) + 6px);
}

.content{
  flex:1;
  min-height:0;
  overflow:hidden;
  padding:8px 11px 6px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.content.scroll-ok{
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  justify-content:flex-start;
}
.view-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
}
.content.scroll-ok .view-body{
  overflow:visible;
  flex:0 0 auto;
}
.inner-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-right:2px;
}

.brand{font-weight:800;letter-spacing:.4px;font-size:13.5px;line-height:1.05;flex-shrink:0}
.brand span{display:block;font-size:7.5px;color:#e8b923;letter-spacing:1.8px;font-weight:700}
.abR{margin-left:auto;display:flex;gap:5px;align-items:center;min-width:0}
.pill{background:#1e2848;border:1px solid #2b3763;border-radius:99px;padding:2px 8px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.pill.gold{border-color:#e8b923;color:#ffd76a;font-weight:700;flex-shrink:0}
.pill.red{border-color:#d43b3b;color:#ff9b8a;font-weight:700;flex-shrink:0}
.pill.green{border-color:#28a86b;color:#7fe0b0;font-weight:700;flex-shrink:0}
.mini{background:#1e2848;border:1px solid #2b3763;color:#e9ecf5;border-radius:8px;padding:5px 8px;font-size:11.5px;min-height:30px;font-weight:700;flex-shrink:0}
.mini.hot{background:#d43b3b;border-color:#ff8a6a;color:#fff}
.mini:active{background:#e8b923;color:#111}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border-radius:10px}
button:disabled{opacity:.42;cursor:not-allowed;pointer-events:none}
h2{font-size:16px;margin:0;line-height:1.15;flex-shrink:0}
h3{font-size:11.5px;margin:4px 0 3px;color:#ffd76a;flex-shrink:0}
p{margin:0 0 4px;font-size:12px}
.sub{color:#8b93ab;font-size:10.5px;line-height:1.25;margin:0;flex-shrink:0}
.panel{background:#131b31;border:1px solid #232e52;border-radius:11px;padding:8px 10px;margin:0;flex-shrink:0}
.panel.win{border-color:#28a86b;background:linear-gradient(180deg,#132a22,#131b31)}
.panel.lose{border-color:#d43b3b;background:linear-gradient(180deg,#2a1414,#131b31)}
.panel.gold-box{border-color:#e8b923;background:linear-gradient(180deg,rgba(232,185,35,.16),#131b31)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}
.mode{border:1px solid #232e52;background:#18213c;border-radius:11px;padding:8px 9px;text-align:left;min-height:62px;transition:border-color .15s}
.mode:active{border-color:#e8b923}
.mode b{display:block;font-size:12px;color:#ffd76a;margin-bottom:2px}
.mode i{font-style:normal;color:#8b93ab;font-size:10px;line-height:1.2;display:block}

.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.doc-card{background:#0d1424;border:1px solid #1f2a4d;border-radius:8px;padding:5px 7px}
.doc-card .sub{font-size:9.5px;line-height:1.18;margin-top:2px;display:block}

.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0}
.pack-card{background:#131b31;border:1px solid #232e52;border-radius:11px;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.pack-card h3{margin:0 0 3px;font-size:12px}
.pack-card .sub{font-size:10px;margin-bottom:6px}

.btn{background:linear-gradient(180deg,#e8b923,#c9931a);color:#141414;border:none;font-weight:800;padding:9px 12px;font-size:12px;min-height:38px;flex-shrink:0}
.btn:active{filter:brightness(1.12)}
.btn.ghost{background:#1e2848;color:#e9ecf5;border:1px solid #2b3763;font-weight:600}
.btn.danger{background:linear-gradient(180deg,#d43b3b,#a82828);color:#fff;border:1px solid #ff8a6a;font-weight:700}
.btn.sm{padding:6px 10px;font-size:11px;min-height:32px}
.btn.wide{width:100%}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.bar.between{justify-content:space-between}

.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;color:#8b93ab;padding:4px 0;min-height:44px;border-radius:9px;font-weight:600}
.tab .ic{font-size:16px;line-height:1.1}
.tab.on{color:#ffd76a;background:rgba(232,185,35,.12)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.sm{grid-template-columns:repeat(5,1fr);gap:5px}
/* === VENTANA EMERGENTE (MODAL DE CONFIRMACIÓN) === */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(4,7,15,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#131b31;border:1px solid #3b4c82;border-radius:15px;padding:16px;max-width:340px;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.85);animation:modalIn .16s ease-out}
@keyframes modalIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 6px;font-size:15px;color:#ffd76a}
.modal p{margin:0 0 14px;font-size:12.5px;color:#cfd6e8;line-height:1.38}
.modal .bar{justify-content:flex-end}

/* === VISOR EMERGENTE DE CROMO EN GRANDE (ZOOM + SWIPE) === */
.zoom-bg{
  position:fixed;
  inset:0;
  z-index:150;
  background:rgba(4,7,15,.88);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  cursor:pointer;
  touch-action:pan-y;
  animation:zoomFadeIn .16s ease-out;
}
@keyframes zoomFadeIn{from{opacity:0}to{opacity:1}}
.zoom-card-wrap{
  width:min(78vw, 300px);
  max-height:74vh;
  aspect-ratio:3 / 4.1;
  position:relative;
  will-change:transform,opacity;
}
.zoom-card-wrap .cromo{
  width:100%;
  height:100%;
  border-radius:16px;
  box-shadow:0 18px 46px rgba(0,0,0,.92), 0 0 26px var(--tier, rgba(232,185,35,.55));
}
.zoom-card-wrap .cromo .top{padding:12px 12px 0}
.zoom-card-wrap .cromo .cost{font-size:20px;padding:2px 10px;border-radius:9px;border-width:1.5px}
.zoom-card-wrap .cromo .gem-wrap svg{width:26px;height:26px}
.zoom-card-wrap .cromo .badge{font-size:14px;padding:3px 10px;bottom:6px;right:6px}
.zoom-card-wrap .cromo .bot{padding:24px 12px 12px;font-size:16px}
.zoom-card-wrap .cromo .nm{font-size:17px;margin-bottom:3px}
.zoom-card-wrap .cromo .st{font-size:14.5px}
.zoom-card-wrap .cromo .art{font-size:52px}
.zoom-meta{
  margin-top:14px;
  text-align:center;
  pointer-events:none;
}
.zoom-meta b{display:block;font-size:13px;color:#ffd76a;margin-bottom:3px}
.zoom-meta span{font-size:11.5px;color:#cfd6e8;opacity:.85}

/* === CONTENEDOR DESLIZABLE DE LA FICHA DE STATS === */
.detalle-swipe{
  touch-action:pan-y;
  will-change:transform,opacity;
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.ficha .caja.zoomable{
  cursor:zoom-in;
  position:relative;
}
.ficha .caja.zoomable:active{
  transform:scale(.97);
}
.zoom-badge-hint{
  display:block;
  text-align:center;
  font-size:9px;
  color:#ffd76a;
  margin-top:3px;
  opacity:.85;
}
.nav-strip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#0d1424;
  border:1px solid #232e52;
  border-radius:9px;
  padding:4px 8px;
  flex-shrink:0;
}
.nav-strip span{
  font-size:10.5px;
  color:#8b93ab;
  text-align:center;
}
.nav-strip b{color:#ffd76a}

@keyframes slideInFromRight{
  from{transform:translateX(54px);opacity:.25}
  to{transform:translateX(0);opacity:1}
}
@keyframes slideInFromLeft{
  from{transform:translateX(-54px);opacity:.25}
  to{transform:translateX(0);opacity:1}
}
.anim-next{animation:slideInFromRight .2s cubic-bezier(.2,.8,.2,1)}
.anim-prev{animation:slideInFromLeft .2s cubic-bezier(.2,.8,.2,1)}

/* === VENTANA EMERGENTE SUPERIOR DE LOGRO OCULTO === */
.ach-toast{
  position:fixed;
  top:calc(var(--sat) + 10px);
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  width:calc(100% - 28px);
  max-width:360px;
  background:linear-gradient(135deg,#1d2646,#0e1428);
  border:2px solid #e8b923;
  border-radius:14px;
  padding:11px 14px;
  box-shadow:0 10px 28px rgba(0,0,0,.85), 0 0 18px rgba(232,185,35,.45);
  display:flex;
  align-items:center;
  gap:11px;
  pointer-events:none;
  opacity:1;
  animation:achDropIn .25s ease-out;
  transition:opacity .85s ease, transform .85s ease;
}
.ach-toast.fade-out{
  opacity:0;
  transform:translate(-50%, -12px);
}
@keyframes achDropIn{
  from{opacity:0;transform:translate(-50%, -18px)}
  to{opacity:1;transform:translate(-50%, 0)}
}
.ach-toast .ach-ic{
  flex:0 0 auto;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd76a,#c9931a);
  color:#141414;
  font-size:20px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 10px rgba(232,185,35,.6);
}
.ach-toast .ach-txt{flex:1;min-width:0}
.ach-toast .ach-txt b{display:block;font-size:12.5px;color:#ffd76a;letter-spacing:.3px;margin-bottom:2px}
.ach-toast .ach-txt span{display:block;font-size:11px;color:#e9ecf5;line-height:1.25}

/* === CONTENEDOR DE LIENZO PERSISTENTE PARA TRUMP GOLDEN === */
@keyframes gemShimmer {
  0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 7px var(--tier)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--tier)); }
}

.gold-slot{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#141c34;
}
.gold-slot img.gold-static-fb,
.gold-slot canvas.gold-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
}
.gold-slot.has-canvas img.gold-static-fb{
  display:none !important;
}

.cromo{
  position: relative;
  aspect-ratio: 3 / 4.1;
  border-radius: 10px;
  border: none;
  background: linear-gradient(180deg, rgba(19,27,49,0.95), rgba(7,11,22,0.98));
  box-shadow: 0 5px 14px rgba(0,0,0,0.65), 0 0 10px var(--tier, rgba(232,185,35,0.35));
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width:0;
  transition: transform .15s ease, box-shadow .15s ease;
}

.cromo .frame-overlay{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url('cards/frame.webp');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 3px var(--tier));
}

.cromo[style*="#b07a45"] .frame-overlay { filter: hue-rotate(140deg) saturate(1.2) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#4a7fb5"] .frame-overlay { filter: hue-rotate(0deg) saturate(1) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#8b5cf6"] .frame-overlay { filter: hue-rotate(240deg) saturate(1.5) drop-shadow(0 0 3px var(--tier)); }
.cromo[style*="#e8b923"] .frame-overlay { filter: hue-rotate(35deg) saturate(1.8) brightness(1.1) drop-shadow(0 0 5px var(--tier)); }

.cromo.sel::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:3.5px solid #ffd76a;
  box-shadow:inset 0 0 14px rgba(255,215,106,.85), 0 0 12px rgba(255,215,106,.75);
  z-index:8;
  pointer-events:none;
}
.cromo.sel{
  transform:translateY(-2px);
}
.cromo.tgt::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:3px solid #ff8a6a;
  box-shadow:inset 0 0 12px rgba(255,138,106,.8);
  z-index:8;
  pointer-events:none;
}
.cromo .sel-tag{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:9;
  background:rgba(232,185,35,.95);
  color:#111;
  font-size:8.5px;
  font-weight:900;
  padding:2px 6px;
  border-radius:99px;
  letter-spacing:.4px;
  box-shadow:0 2px 8px rgba(0,0,0,.85);
  pointer-events:none;
  white-space:nowrap;
}

.cromo .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:rgba(255,255,255,.15)}
.cromo .art img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.cromo .top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 6px 0}
.cromo .cost{background:rgba(0,0,0,.82);border:1px solid var(--tier,#555);border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:900;color:#ffd76a}
.cromo .gem-wrap{display:inline-flex;align-items:center;justify-content:center;animation:gemShimmer 3.5s infinite ease-in-out}
.cromo .bot{position:relative;z-index:4;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92) 45%);padding:10px 6px 5px;font-size:8.5px;line-height:1.12}
.cromo .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cromo .st{display:block;color:#cfd6e8;font-weight:700}
.cromo.busy{filter:saturate(.55) brightness(.85)}
.cromo .crown{position:absolute;top:1px;left:50%;transform:translateX(-50%);z-index:9;font-size:12px;color:#ffd76a;text-shadow:0 0 5px #000}
.cromo .lbl{position:absolute;z-index:9;top:3px;left:3px;font-size:8px;font-weight:800;color:#111;background:#ffd76a;border-radius:4px;padding:0 4px}
.star{position:absolute;z-index:9;top:3px;right:3px;width:25px;height:25px;border-radius:50%;border:1px solid #2b3763;background:rgba(8,12,24,.88);font-size:13px;padding:0;color:#8b93ab}
.star.on{background:#e8b923;color:#141414;border-color:#ffd76a;box-shadow:0 0 8px #ffd76a}
.badge{position:absolute;z-index:9;bottom:3px;right:3px;background:rgba(8,12,24,.92);border:1px solid #2b3763;border-radius:99px;padding:1px 5px;font-size:8.5px;font-weight:800;color:#ffd76a}

/* === LAYOUT COMPACTO DE BATALLA A PANTALLA COMPLETA === */
.battle-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:3px;
}
.row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;flex-shrink:0}
.row>*{flex:0 0 auto;width:74px;scroll-snap-align:center}
.tribuna{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;width:100%;margin:0 auto;flex-shrink:0}
.tribuna .cromo{aspect-ratio:3 / 3.7}
.tribuna .slot{border:1px dashed #232e52;border-radius:9px;aspect-ratio:3 / 3.7;display:flex;align-items:center;justify-content:center;color:#39456e;font-size:11px;font-weight:700;text-align:center;padding:4px}
.tribuna .slot.tgt{border-color:#ff8a6a;color:#ff8a6a;border-style:solid;cursor:pointer}
.vbars{display:grid;gap:3px;flex-shrink:0}
.vbar{display:flex;align-items:center;gap:6px;font-size:10.5px}
.vbar .track{flex:1;height:8px;background:#0c1324;border:1px solid #232e52;border-radius:99px;overflow:hidden}
.vbar .fill{height:100%;width:0;transition:width .25s ease}
.vbar.me .fill{background:linear-gradient(90deg,#3b6fd4,#6ea8ff)}
.vbar.foe .fill{background:linear-gradient(90deg,#d43b3b,#ff8a6a)}
.vbar b{min-width:42px;text-align:right;font-size:10.5px}
.crystal{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #3b6fd4;background:#4f8bea;vertical-align:middle;margin-right:2px}
.crystal.off{background:#151d33;border-color:#2b3763}
.log{background:#0a1020;border:1px solid #232e52;border-radius:8px;padding:4px 7px;font-size:10px;height:44px;overflow-y:auto;color:#c3cbe0;flex-shrink:0}
.log .hi{color:#ffd76a}
.hint{background:#1a2547;border:1px solid #3b6fd4;border-radius:8px;padding:4px 7px;font-size:10.5px;color:#bcd2ff;flex-shrink:0}
.gab{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0}
.gab span{font-size:9px;border:1px solid #2b3763;border-radius:5px;padding:1px 5px;background:#0d1424;color:#8b93ab}
.gab span.on{color:#111;background:#ffd76a;border-color:#ffd76a;font-weight:800}
.gab span.field{color:#111;background:#7fe0b0;border-color:#7fe0b0;font-weight:800}
.gab span.pas{color:#ff9b8a;border-color:#d43b3b}
.chips{display:flex;gap:5px;overflow-x:auto;padding:2px 0 5px;-webkit-overflow-scrolling:touch;flex-shrink:0}
.chip{border:1px solid #2b3763;background:#1e2848;border-radius:99px;padding:5px 10px;font-size:11px;min-height:32px;white-space:nowrap;flex-shrink:0}
.chip.on{background:#e8b923;color:#141414;border-color:#ffd76a;font-weight:800}
input{width:100%;background:#0b1224;border:1px solid #2b3763;border-radius:9px;color:#e9ecf5;padding:7px 10px;font:inherit;font-size:12.5px;min-height:38px;margin-bottom:5px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:4px 3px;border-bottom:1px solid #232e52;text-align:left}

var UID=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
var MEM={};
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):(MEM[k]||null);}catch(e){return MEM[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){MEM[k]=v;}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var ART_BASE='cards/';

/* === MOTOR PING-PONG MATEMÁTICO PURO + POOL DE CANVAS PERSISTENTES === */
var GOLD_LOOP={
 state:'idle',
 frames:[],
 w:0,
 h:0,
 duration:3100,
 pool:[],
 rafId:null
};

function getGoldPingPongIndex(now){
 var len=GOLD_LOOP.frames.length;
 if(len<=1)return 0;
 var totalSteps=(len*2)-2;
 var stepDur=GOLD_LOOP.duration/len;
 var step=Math.floor(now/stepDur)%totalSteps;
 return (step<len)?step:(totalSteps-step);
}

function detachGoldPool(container){
 if(!container)return;
 var activeCvs=container.querySelectorAll('canvas.gold-canvas');
 for(var i=0;i<activeCvs.length;i++){
  var cv=activeCvs[i];
  if(cv.parentNode)cv.parentNode.removeChild(cv);
  if(GOLD_LOOP.pool.indexOf(cv)<0)GOLD_LOOP.pool.push(cv);
 }
}

function getPooledCanvas(){
 var cv=GOLD_LOOP.pool.pop();
 if(!cv){
  cv=document.createElement('canvas');
  cv.className='gold-canvas';
  cv._lastIdx=-1;
 }
 if(GOLD_LOOP.w>0 && (cv.width!==GOLD_LOOP.w || cv.height!==GOLD_LOOP.h)){
  cv.width=GOLD_LOOP.w;
  cv.height=GOLD_LOOP.h;
  cv._lastIdx=-1;
 }
 return cv;
}

function drawCurrentGoldFrame(now){
 if(GOLD_LOOP.state!=='ready'||!GOLD_LOOP.frames.length)return 0;
 var slots=document.querySelectorAll('.gold-slot');
 if(!slots.length)return 0;
 var fIdx=getGoldPingPongIndex(now || performance.now());
 var chosen=GOLD_LOOP.frames[fIdx].bmp;
 for(var i=0;i<slots.length;i++){
  var slot=slots[i];
  var cv=slot.querySelector('canvas.gold-canvas');
  if(!cv){
   cv=getPooledCanvas();
   slot.appendChild(cv);
  }
  if(cv.width!==GOLD_LOOP.w || cv.height!==GOLD_LOOP.h){
   cv.width=GOLD_LOOP.w;
   cv.height=GOLD_LOOP.h;
   cv._lastIdx=-1;
  }
  if(cv._lastIdx!==fIdx){
   var ctx=cv.getContext('2d');
   if(ctx){
    ctx.drawImage(chosen,0,0,GOLD_LOOP.w,GOLD_LOOP.h);
    cv._lastIdx=fIdx;
   }
  }
  if(!slot.classList.contains('has-canvas')){
   slot.classList.add('has-canvas');
  }
 }
 return slots.length;
}

function syncGoldCanvases(){
 if(GOLD_LOOP.state!=='ready'||!GOLD_LOOP.frames.length)return;
 var count=drawCurrentGoldFrame(performance.now());
 if(count>0)startGoldRaf();
}

function startGoldRaf(){
 if(GOLD_LOOP.rafId)return;
 var tick=function(now){
  var activeCount=drawCurrentGoldFrame(now);
  if(activeCount>0){
   GOLD_LOOP.rafId=requestAnimationFrame(tick);
  } else {
   GOLD_LOOP.rafId=null;
  }
 };
 GOLD_LOOP.rafId=requestAnimationFrame(tick);
}

function isFrameValid(sampleCtx, sampleW, sampleH, sourceCanvas){
 try{
  sampleCtx.clearRect(0,0,sampleW,sampleH);
  sampleCtx.drawImage(sourceCanvas,0,0,sampleW,sampleH);
  var data=sampleCtx.getImageData(0,0,sampleW,sampleH).data;
  var totalPixels=sampleW*sampleH;
  var opaqueCount=0,lumaSum=0;
  for(var i=0;i<data.length;i+=4){
   var a=data[i+3];
   if(a>40){
    opaqueCount++;
    lumaSum+=(data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
   }
  }
  if(opaqueCount < totalPixels*0.35)return false;
  var avgLuma=lumaSum/opaqueCount;
  if(avgLuma < 6)return false;
  return true;
 }catch(e){
  return true;
 }
}

function ensureGoldLoop(){
 if(GOLD_LOOP.state==='ready'){
  syncGoldCanvases();
  return;
 }
 if(GOLD_LOOP.state!=='idle')return;
 var url=ART_BASE+'donald-trump-golden.webp';
 if(typeof window.ImageDecoder==='function' && typeof window.fetch==='function' && location.protocol!=='file:'){
  GOLD_LOOP.state='loading';
  fetch(url,{cache:'force-cache'}).then(function(res){
   if(!res.ok)throw new Error('HTTP '+res.status);
   return res.arrayBuffer();
  }).then(function(buf){
   var dec=new ImageDecoder({data:buf,type:'image/webp'});
   return dec.tracks.ready.then(function(){
    var cnt=dec.tracks.selectedTrack.frameCount||0;
    if(cnt<=1)throw new Error('Static webp');
    var rawList=[],p=Promise.resolve();
    var stageCanvas=document.createElement('canvas');
    var stageCtx=stageCanvas.getContext('2d');
    var sampleCanvas=document.createElement('canvas');
    sampleCanvas.width=16;sampleCanvas.height=22;
    var sampleCtx=sampleCanvas.getContext('2d',{willReadFrequently:true});

    var step=function(idx){
     return dec.decode({frameIndex:idx,completeFramesOnly:true}).then(function(res){
      var img=res.image;
      var fw=img.displayWidth||img.codedWidth||400;
      var fh=img.displayHeight||img.codedHeight||550;
      if(stageCanvas.width!==fw || stageCanvas.height!==fh){
       stageCanvas.width=fw;
       stageCanvas.height=fh;
       stageCtx.fillStyle='#141c34';
       stageCtx.fillRect(0,0,fw,fh);
      }
      stageCtx.drawImage(img,0,0,fw,fh);
      var rawDur=(img.duration?img.duration/1000:0)||(GOLD_LOOP.duration/cnt);
      var dur=Math.min(100, Math.max(16, rawDur));
      img.close();
      var valid=isFrameValid(sampleCtx,16,22,stageCanvas);
      return createImageBitmap(stageCanvas).then(function(bmp){
       rawList.push({bmp:bmp,dur:dur,valid:valid});
      });
     });
    };
    for(var i=0;i<cnt;i++)(function(ix){p=p.then(function(){return step(ix);});})(i);
    return p.then(function(){
     var clean=rawList.filter(function(f){return f.valid;});
     if(clean.length<2)clean=rawList;
     GOLD_LOOP.frames=clean;
     GOLD_LOOP.w=clean[0].bmp.width;
     GOLD_LOOP.h=clean[0].bmp.height;
     var total=0;
     for(var j=0;j<clean.length;j++)total+=clean[j].dur;
     if(total>300)GOLD_LOOP.duration=total;
     GOLD_LOOP.state='ready';
     syncGoldCanvases();
    });
   });
  }).catch(function(){
   GOLD_LOOP.state='fallback';
  });
 } else {
  GOLD_LOOP.state='fallback';
 }
}

function gem(rKey, col){
 var ptsCount = (rKey === 'legendario') ? 9 : (rKey === 'especial') ? 7 : (rKey === 'raro') ? 5 : 3;
 var pts=[], i, ang, rad;
 for(i=0; i < ptsCount * 2; i++){
  ang = -Math.PI / 2 + i * Math.PI / ptsCount;
  rad = (i % 2) ? 3.2 : 6.8;
  pts.push((10 + Math.cos(ang) * rad).toFixed(1) + ',' + (10 + Math.sin(ang) * rad).toFixed(1));
 }
 return '<span class="gem-wrap"><svg viewBox="0 0 20 20" width="14" height="14"><polygon points="'+pts.join(' ')+'" fill="'+col+'" stroke="rgba(255,255,255,0.7)" stroke-width=".9"/></svg></span>';
}

}

(function initSwipeGestures(){
 var sx=0,sy=0,dx=0,dy=0,tracking=false,lockedHoriz=false;

 function applyDragTransform(offsetX){
  var det=document.getElementById('detalleSwipe');
  var zWrap=document.getElementById('zoomCardWrap');
  var clamped=Math.max(-140,Math.min(140,offsetX));
  var op=Math.max(0.55, 1 - Math.abs(clamped)/260);
  if(det){
   det.style.transition='none';
   det.style.transform='translateX('+(clamped*0.65)+'px)';
   det.style.opacity=op;
  }
  if(zWrap){
   zWrap.style.transition='none';
   zWrap.style.transform='translateX('+clamped+'px) rotate('+(clamped*0.035)+'deg)';
   zWrap.style.opacity=op;
  }
 }

 function resetDragTransform(){
  var det=document.getElementById('detalleSwipe');
  var zWrap=document.getElementById('zoomCardWrap');
  if(det){
   det.style.transition='transform .18s ease, opacity .18s ease';
   det.style.transform='';
   det.style.opacity='';
  }
  if(zWrap){
   zWrap.style.transition='transform .18s ease, opacity .18s ease';
   zWrap.style.transform='';
   zWrap.style.opacity='';
  }
 }

 function canStartSwipe(target){
  if(SCREEN!=='detalle')return false;
  if(MODAL_CB)return false;
  if(ZOOM_OPEN)return true;
  if(target && target.closest && target.closest('#detalleSwipe'))return true;
  return false;
 }

 function onStart(x,y,target){
  if(!canStartSwipe(target))return;
  sx=x;sy=y;dx=0;dy=0;
  tracking=true;
  lockedHoriz=false;
 }

 function onMove(x,y,ev){
  if(!tracking)return;
  dx=x-sx;
  dy=y-sy;
  if(!lockedHoriz){
   if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.25){
    lockedHoriz=true;
   } else if(Math.abs(dy)>18 && Math.abs(dy)>Math.abs(dx)){
    tracking=false;
    resetDragTransform();
    return;
   }
  }
  if(lockedHoriz){
   if(ev && ev.cancelable)ev.preventDefault();
   applyDragTransform(dx);
  }
 }

 function onEnd(){
  if(!tracking)return;
  tracking=false;
  if(lockedHoriz && Math.abs(dx)>=42){
   SWIPE_BLOCK_CLICK=Date.now()+320;
   var step=(dx<0)?1:-1;
   if(!cycleDetalleCard(step)){
    resetDragTransform();
   }
  } else {
   if(lockedHoriz)SWIPE_BLOCK_CLICK=Date.now()+220;
   resetDragTransform();
  }
  lockedHoriz=false;
 }

 document.addEventListener('touchstart',function(ev){
  if(!ev.touches||ev.touches.length!==1)return;
  onStart(ev.touches[0].clientX,ev.touches[0].clientY,ev.target);
 },{passive:true});

 document.addEventListener('touchmove',function(ev){
  if(!tracking||!ev.touches||!ev.touches.length)return;
  onMove(ev.touches[0].clientX,ev.touches[0].clientY,ev);
 },{passive:false});

 document.addEventListener('touchend',onEnd,{passive:true});
 document.addEventListener('touchcancel',function(){tracking=false;resetDragTransform();},{passive:true});

 document.addEventListener('mousedown',function(ev){
  if(ev.button!==0)return;
  onStart(ev.clientX,ev.clientY,ev.target);
 },false);

 document.addEventListener('mousemove',function(ev){
  if(!tracking)return;
  onMove(ev.clientX,ev.clientY,ev);
 },false);

 document.addEventListener('mouseup',onEnd,false);
})();

window.addEventListener('keydown',function(ev){
 if(ev.key==='Escape'){
  if(ZOOM_OPEN){closeZoom();return;}
  closeModal();
  return;
 }
 if(SCREEN==='detalle' && !MODAL_CB){
  if(ev.key==='ArrowRight')cycleDetalleCard(1);
  else if(ev.key==='ArrowLeft')cycleDetalleCard(-1);
 }
});

/* === GENERADOR DE GABINETE RIVAL EQUILIBRADO SIN INFLAR STATS === */
function buildEnemyTeam(mode, elo, div){
 var recipe=['comun','comun','raro','raro','especial'];
 if(mode==='normal'){
  recipe=['comun','comun','comun','raro','raro'];
 } else if(mode==='liga'){
  var dv=div||3;
  if(dv===3)recipe=['comun','comun','comun','raro','raro'];
  else if(dv===2)recipe=['comun','raro','raro','especial','especial'];
  else recipe=['raro','raro','especial','especial','legendario'];
 } else if(mode==='ranked'){
  if(elo<450)recipe=['comun','comun','comun','raro','raro'];
  else if(elo<750)recipe=['comun','comun','raro','raro','especial'];
  else if(elo<1100)recipe=['comun','raro','raro','especial','legendario'];
  else recipe=['raro','raro','especial','especial','legendario'];
 }
 var picked=[],used={};
 recipe.forEach(function(tier){
  var pool=shuffle(CARDS.filter(function(c){return c.r===tier && !used[c.id];}));
  if(!pool.length)pool=shuffle(CARDS.filter(function(c){return !used[c.id];}));
  if(pool.length){
   used[pool[0].id]=true;
   picked.push(pool[0].id);
  }
 });
 return picked;
}

function newBattle(mode,rival){
 clearAI();
 var d=D(),team=BUILD.ids.slice(0,5),ldrId=BUILD.leader||team[0];
 var eTeam=buildEnemyTeam(mode, d.elo, SO.div||3);
 /* Elegimos como Líder del rival su carta de mayor rango para que juegue con cabeza pero con sus stats reales */
 var eSorted=eTeam.slice().sort(function(a,b){return TIERORDER[BYID[a].r]-TIERORDER[BYID[b].r];});
 var eLeadId=eSorted[0]||eTeam[0];

 G={mode:mode,rival:rival||pick(['Grupo Mixto','Bancada Gris','Coalicion Improbable','Grupo del Pasillo','Mesa del Cafe','Los Indecisos']),
  eTeam:eTeam,pTeam:team.slice(),
  n:0,over:false,done:false,side:'p',votes:{p:0,e:0},tdp:{p:0,e:0},tdpMax:{p:2,e:2},
  field:{p:[],e:[]},hand:{p:[],e:[]},deck:{p:[],e:[]},pas:{p:[],e:[]},log:[],sel:null,saved:{},leader:{}};
 var build=function(s,ids,lead){
  var dk=shuffle(ids).map(function(id){return mk(BYID[id], id===lead);}),lc=null,i;
  for(i=0;i<dk.length;i++)if(dk[i].k===lead)lc=dk[i];
  if(!lc){lc=mk(BYID[lead], true);dk.unshift(lc);}
  var hi=dk.indexOf(lc);
  if(hi>=0)dk.splice(hi,1);
  var hand=dk.splice(0,2);
  hand.unshift(lc);
  G.leader[s]=lc;G.deck[s]=dk;G.hand[s]=hand;
 };
 build('p',team,ldrId);
 build('e',eTeam,eLeadId);
 log('Comienza el debate contra '+G.rival+'.','hi');
 log('Tu gabinete: '+team.map(function(id){return BYID[id].n;}).join(', ')+'.');
 go('battle');
 startTurn('p');
}

function log(t,cls){if(!G)return;G.log.unshift('<div'+(cls?' class="'+cls+'"':'')+'>'+esc(t)+'</div>');if(G.log.length>40)G.log.pop();}
function doc(s){var l=G.leader[s];if(!l)return null;for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===l.uid)return l.pa;return null;}
function leaderOn(s){var l=G.leader[s];if(!l)return false;for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===l.uid)return true;return false;}
function enMano(s,uid){for(var i=0;i<G.hand[s].length;i++)if(G.hand[s][i].uid===uid)return true;return false;}
function enMesa(s,uid){for(var i=0;i<G.field[s].length;i++)if(G.field[s][i].uid===uid)return true;return false;}

function draw(s){
 if(!G.deck[s].length && G.pas[s].length){
  G.pas[s].forEach(function(c){c.h=c.hm;c.ready=true;});
  G.deck[s]=shuffle(G.pas[s]);
  G.pas[s]=[];
  log((s==='p'?'Tus oradores en descanso':'Los oradores rivales en descanso')+' vuelven al mazo.');
 }
 while(G.deck[s].length && G.hand[s].length<7){
  var c=G.deck[s].shift();
  if(!enMano(s,c.uid) && !enMesa(s,c.uid)){
   c.h=c.hm;
   c.ready=true;
   G.hand[s].push(c);
   break;
  }
 }
}

function startTurn(s){
 if(!G||G.over)return;
 if(G.n>=14){endByVotes();return;}
 G.n++;G.side=s;G.sel=null;
 G.tdpMax[s]=Math.min(6,G.tdpMax[s]+1);
 G.tdp[s]=G.tdpMax[s]+((doc(s)==='verborrea')?1:0);
 draw(s);
 if(doc(s)==='foco'&&leaderOn(s)){
  G.leader[s].h=Math.min(G.leader[s].hm,G.leader[s].h+1);
 }
 G.field[s].forEach(function(c){c.ready=true;});
 var gain=3;G.field[s].forEach(function(c){gain+=c.v;});
 G.votes[s]+=gain;
 var roundNum=Math.ceil(G.n/2);
 log('Ronda '+roundNum+'/7 ('+(s==='p'?'Tu turno':'Turno rival')+'): +'+gain+' votos.');
 paint();
 if(G.votes[s]>=100){finish(s);return;}
 if(s==='e'){clearAI();AITIMER=setTimeout(aiStep,520);}
}

function applyGuardia(s){

  var grew=false;
  G.field[s].forEach(function(c){
   if((c.buff||0)<3){c.buff=(c.buff||0)+1;c.a++;grew=true;}
  });
  if(grew)log('Vieja Guardia: los oradores '+(s==='p'?'tuyos':'rivales')+' ganan +1 Zasca.');
 }
}

function endTurn(){
 if(!G||G.over||G.side!=='p')return;

}

function expel(owner,card,attacker,victimDocSnapshot){
 var victim=owner==='p'?'e':'p';
 if(!enMesa(victim,card.uid))return;
 var activeVictimDoc=(victimDocSnapshot!==undefined)?victimDocSnapshot:doc(victim);
 if(activeVictimDoc==='aforado'&&!G.saved[card.uid]){
  G.saved[card.uid]=true;card.h=1;
  log(card.n+' invoca el Aforado y se aferra al escano con 1 de Aguante.','hi');
  return;
 }
 G.field[victim]=G.field[victim].filter(function(c){return c.uid!==card.uid;});
 card.h=card.hm;
 card.ready=true;
 G.pas[victim].push(card);
 if(attacker){
  G.votes[owner]+=card.v;
  log(card.n+' es expulsado: +'+card.v+' votos '+(owner==='p'?'para ti.':'para '+G.rival+'.'),'hi');
 } else {
  log(card.n+' abandona la Tribuna.');
 }
 if(activeVictimDoc==='verborrea'){
  G.tdp[victim]+=2;
  log('Verborrea: +2 TdP para '+(victim==='p'?'ti.':'el rival.'));
 }
}

function playCard(s,uid){
 var idx=-1,i;
 for(i=0;i<G.hand[s].length;i++)if(G.hand[s][i].uid===uid)idx=i;
 if(idx<0)return false;
 var c=G.hand[s][idx];
 if(c.c>G.tdp[s]||G.field[s].length>=3)return false;
 G.hand[s].splice(idx,1);
 c.h=c.hm;
 c.ready=true;
 G.field[s].push(c);G.tdp[s]-=c.c;
 log((s==='p'?'Presentas':'El rival presenta')+' a '+c.n+(c.uid===G.leader[s].uid?' (Lider en Tribuna: doctrina '+DOCM[c.pa].n+' activa).':'.'));
 return true;
}

function attack(atk,tgt,owner){
 var foe=owner==='p'?'e':'p';
 var ownerDoc=doc(owner),foeDoc=doc(foe);
 atk.ready=false;
 if(tgt==='__EMPTY'){
  var stolen=Math.min(G.votes[foe],atk.a);
  G.votes[foe]=Math.max(0,G.votes[foe]-atk.a);
  log(atk.n+' lanza '+pick(atk.q)+' a la bancada vacia (-'+stolen+' votos '+(foe==='e'?'al rival':'para ti')+').','hi');
  if(ownerDoc==='foco'&&G.leader[owner]&&atk.uid===G.leader[owner].uid){
   G.votes[owner]+=1;
   log('Foco Mediatico: +1 voto para '+(owner==='p'?'ti.':G.rival+'.'));
  }
  if(G.votes[owner]>=100){finish(owner);return;}
  return;
 }
 var isFoeLead=(G.leader[foe]&&tgt.uid===G.leader[foe].uid);
 var bonus=(ownerDoc==='viperina'&&isFoeLead)?2:0;
 log(atk.n+' lanza '+pick(atk.q)+' ('+(atk.a+bonus)+' de dano a '+tgt.n+').','hi');
 tgt.h-=atk.a+bonus;
 if(foeDoc==='giro'&&tgt!==atk){
  atk.h-=2;
  log('Giro de Guion: '+atk.n+' recibe 2 de dano.');
 }
 if(ownerDoc==='foco'&&G.leader[owner]&&atk.uid===G.leader[owner].uid){
  G.votes[owner]+=1;
  log('Foco Mediatico: +1 voto para '+(owner==='p'?'ti.':G.rival+'.'));
 }
 if(tgt.h<=0)expel(owner,tgt,atk,foeDoc);
 if(atk.h<=0)expel(foe,atk,null,ownerDoc);
 if(G.votes[owner]>=100){finish(owner);return;}
}

function endByVotes(){
 if(!G)return;
 G.over=true;
 log('Fin de las 7 rondas reglamentarias. Recuento de votos...','hi');
 if(G.votes.p>G.votes.e)finish('p');
 else if(G.votes.e>G.votes.p)finish('e');
 else finish('d');
}

/* === CÁLCULO DE ELO DINÁMICO POR RENDIMIENTO (+10 a +25 en victoria / -5 a -18 en derrota) === */
function calcRankedEloDelta(who, pVotes, eVotes, turnsPlayed, abandoned){
 var diff=Math.abs(pVotes - eVotes);
 var rounds=Math.ceil((turnsPlayed||1)/2);
 if(who==='p'){
  /* Base +10, hasta +10 por diferencia de votos y hasta +5 por ganar rápido (total 10..25) */
  var marginBonus=Math.min(10, Math.round(diff/8));
  var speedBonus=Math.max(0, Math.min(5, 7 - rounds));
  return Math.max(10, Math.min(25, 10 + marginBonus + speedBonus));
 }
 if(who==='e'){
  if(abandoned)return -18;
  /* Penalización entre -5 (derrota muy reñida o con muchos votos conseguidos) y -18 (derrota amplia) */
  var closeness=Math.min(8, Math.floor(pVotes/12));
  var marginPenalty=Math.min(5, Math.floor(diff/18));
  var loss=13 - closeness + marginPenalty;
  return -Math.max(5, Math.min(18, loss));
 }
 return 0;
}

function finish(who, abandoned){
 if(!G||G.done)return;
 clearAI();
 G.over=true;G.done=true;
 var d=D(),mode=G.mode,fs=0,msg='',won=null,lost=null,comp=(mode!=='normal'),justUnlockedGold=false,eloDelta=0;
 if(who==='p'){
  fs=mode==='normal'?rnd(20,50):rnd(50,100);
  d.w++;
  if(mode==='ranked'){
   eloDelta=calcRankedEloDelta('p', G.votes.p, G.votes.e, G.n, false);
   d.elo+=eloDelta;
  }
  msg='Victoria parlamentaria ('+G.votes.p+' a '+G.votes.e+'). Consigues '+fs+' FS'+(eloDelta?' y +'+eloDelta+' Elo.':'.');
  if(comp&&G.eTeam.length){won=pick(G.eTeam);d.album.push(won);msg+=' Le arrebatas el escano de '+BYID[won].n+'.';}
  if(comp && G.leader && G.leader.p && G.leader.p.k==='donald-trump'){
   d.dtWins=(d.dtWins||0)+1;
   if(d.dtWins>=10 && !d.dtGoldUnlocked){
    d.dtGoldUnlocked=true;

function aiStep(){
 if(!G||G.over||G.side!=='e')return;
 /* 1. Bajar cartas priorizando a su Líder o el orador de mayor impacto */
 if(G.field.e.length<3){
  var playable=G.hand.e.filter(function(c){return c.c<=G.tdp.e;}).sort(function(a,b){
   var aLead=(G.leader.e&&a.uid===G.leader.e.uid)?1:0;
   var bLead=(G.leader.e&&b.uid===G.leader.e.uid)?1:0;
   return (bLead-aLead)||(b.v-a.v)||(b.c-a.c);
  });
  if(playable.length){
   playCard('e',playable[0].uid);
   paint();
   if(!G.over)AITIMER=setTimeout(aiStep,450);
   return;
  }
 }
 /* 2. Elegir objetivo inteligente con los oradores listos */
 var readyAtk=G.field.e.filter(function(c){return c.ready;});
 if(readyAtk.length){
  var atk=readyAtk[0];
  var eDoc=doc('e');
  var tgt='__EMPTY';
  if(G.field.p.length){
   /* Busca primero si puede expulsar de un golpe a algún orador tuyo o dañar a tu Líder */
   var sortedT=G.field.p.slice().sort(function(x,y){
    var dmgX=atk.a+((eDoc==='viperina'&&G.leader.p&&x.uid===G.leader.p.uid)?2:0);
    var dmgY=atk.a+((eDoc==='viperina'&&G.leader.p&&y.uid===G.leader.p.uid)?2:0);
    var killX=(x.h<=dmgX)?1:0;
    var killY=(y.h<=dmgY)?1:0;
    if(killX!==killY)return killY-killX;
    return (y.v-x.v)||(x.h-y.h);
   });
   tgt=sortedT[0];
  }
  attack(atk,tgt,'e');
  paint();
  if(!G.over)AITIMER=setTimeout(aiStep,480);
  return;
 }
 applyGuardia('e');
 paint();
 AITIMER=setTimeout(function(){
  if(G&&!G.over)startTurn('p');
 },380);
}

document.addEventListener('click',function(ev){
 var t=ev.target;
 var root=document.getElementById('app')||document.body;
 if(!root.contains(t)||!t.closest)return;

 /* 1. Gestión prioritaria de los botones de confirmación / cancelación del Modal */
 var mBtn=t.closest('button[data-modal]');
 if(mBtn){
  var mAct=mBtn.getAttribute('data-modal');
  var cb=MODAL_CB;
  closeModal();
  if(mAct==='confirm' && typeof cb==='function')cb();
  return;
 }
 if(t.getAttribute('data-modal')==='bg'){
  closeModal();
  return;
 }
 if(t.closest('.modal'))return;

 if(Date.now() < SWIPE_BLOCK_CLICK){
  ev.preventDefault();
  ev.stopPropagation();
  return;
 }

 if(ZOOM_OPEN && t.closest('#zoomBg')){
  closeZoom();
  return;
 }

 var n=t.closest('[data-go],[data-act],[data-lead],[data-pick],[data-card],[data-buid],[data-fr],[data-fd]');
 if(!n||n.disabled)return;

 if(n.hasAttribute('data-fr')){
  FIL.r=n.getAttribute('data-fr');
  updateColeccionInPlace();
  return;
 }
 if(n.hasAttribute('data-fd')){
  FIL.d=n.getAttribute('data-fd');
  updateColeccionInPlace();
  return;
 }

 if(n.hasAttribute('data-lead')){
  var lid=n.getAttribute('data-lead');
  if(BUILD.ids.indexOf(lid)<0){
   if(BUILD.ids.length<5)BUILD.ids.push(lid);
   else BUILD.ids[4]=lid;
  }
  BUILD.leader=lid;
  paint();return;
 }

 if(n.hasAttribute('data-pick')){
  var pid=n.getAttribute('data-pick'),ix=BUILD.ids.indexOf(pid);
  if(ix>=0){
   BUILD.ids.splice(ix,1);
   if(BUILD.leader===pid)BUILD.leader=BUILD.ids[0]||null;
  } else if(BUILD.ids.length<5){
   BUILD.ids.push(pid);
  } else {
   var oldId=BUILD.ids[4];
   BUILD.ids[4]=pid;
   if(BUILD.leader===oldId)BUILD.leader=pid;
  }
  if(!BUILD.leader&&BUILD.ids.length)BUILD.leader=BUILD.ids[0];
  paint();return;
 }

 if(n.hasAttribute('data-buid')){
  var uid=n.getAttribute('data-buid'),side=n.getAttribute('data-side');
  if(!G||G.over||G.side!=='p')return;
  var i;
  if(enMano('p',uid)){
   var cardKey=uidOf(uid);
   if(G.field.p.length>=3){
    log('Tu Tribuna ya tiene el maximo de 3 oradores.');
   } else if(!playCard('p',uid)){
    log('No te llega el Tiempo de Palabra para presentar a '+(BYID[cardKey]?BYID[cardKey].n:'este orador')+'.');
   }
   paint();return;
  }
  if(side==='e'){
   if(!G.sel){log('Elige primero un orador tuyo de la Tribuna para atacar.');paint();return;}
   var atk=null,tgt=null;
   for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===G.sel)atk=G.field.p[i];
   for(i=0;i<G.field.e.length;i++)if(G.field.e[i].uid===uid)tgt=G.field.e[i];
   if(!tgt)tgt='__EMPTY';
   if(atk&&atk.ready){attack(atk,tgt,'p');G.sel=null;paint();}
   return;
  }
  var own=null;
  for(i=0;i<G.field.p.length;i++)if(G.field.p[i].uid===uid)own=G.field.p[i];
  if(own){
   if(!own.ready){log(own.n+' ya ha intervenido en este turno.');paint();return;}
   G.sel=(G.sel===uid)?null:uid;paint();
  }
  return;
 }

 if(n.hasAttribute('data-card')&&SCREEN==='coleccion'){
  LAST_SWIPE_DIR='';
  go('detalle',{id:n.getAttribute('data-card')});return;
 }

 var act=n.getAttribute('data-act'),dest=n.getAttribute('data-go');
 if(dest){
  if(dest==='builder'){
   SO={mode:n.getAttribute('data-mode')||'normal'};
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
  }
  if(dest==='tienda')FIL={q:'',r:'',d:''};
  if(dest==='battle'&&!G)return;
  go(dest);return;
 }
 if(!act)return;

 switch(act){
  case 'zoomcard':
   openZoom();
   break;
  case 'prevcard':
   cycleDetalleCard(-1);
   break;
  case 'nextcard':
   cycleDetalleCard(1);
   break;
  case 'clearfil':
   FIL={q:'',r:'',d:''};
   updateColeccionInPlace();
   break;
  case 'dtskin':
   if(SCREEN==='detalle' && SO.id==='donald-trump'){
    var d=D();
    if(d.dtGoldUnlocked){
     d.dtGoldActive=(n.getAttribute('data-val')==='golden');
     saveD(d);
     if(d.dtGoldActive)ensureGoldLoop();
     paint();
     if(ZOOM_OPEN)renderZoomOverlay();
    }
   }
   break;
  case 'reset':
   showModal(
    '¿Borrar todo el progreso?',
    'Perderas tu coleccion de cromos, tu Fuerza Soberana, tu rango Elo, logros y el avance en la Liga. Esta accion no se puede deshacer.',
    'Si, borrar todo',
    true,
    function(){
     clearAI();closeZoom();
     try{localStorage.removeItem(LS);localStorage.removeItem(LS2);}catch(e){}
     MEM={};G=null;BUILD={ids:[],leader:null};LAST_BUILD={ids:[],leader:null};FIL={q:'',r:'',d:''};
     D();go('menu');
    }
   );
   break;
  case 'rapida':
   autoBuild();
   LAST_BUILD={ids:BUILD.ids.slice(),leader:BUILD.leader};
   SO={mode:'normal'};
   newBattle('normal');
   break;
  case 'auto':
   autoBuild();paint();break;
  case 'clear':
   BUILD={ids:[],leader:null};paint();break;
  case 'start':
   startBattle();break;
  case 'buy':
   openPack(n.getAttribute('data-k'),false);break;
  case 'free':
   openPack(n.getAttribute('data-k'),true);break;
  case 'again':
   openPack(n.getAttribute('data-k')||SO.k,false);break;
  case 'end':
   endTurn();break;
  case 'abandon':
   if(G&&!G.over){
    showModal(
     '¿Abandonar el debate?',
     'Si abandonas el hemiciclo ahora, se contara como una derrota'+(G.mode!=='normal'?' y podrias perder una copia de un cromo de tu gabinete':'')+'.',
     'Abandonar debate',
     true,
     function(){if(G&&!G.over)finish('e', true);}
    );
   }
   break;
  case 'rev':{
   var m=n.getAttribute('data-mode')||'normal';
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
   SO={mode:m};
   go('builder');
   break;
  }
  case 'liganew':
   lsSet(LS2,ligaNew(3));go('liga');break;
  case 'ligabandon':
   showModal(
    '¿Abandonar la Liga actual?',
    'Se borrara tu clasificacion y progreso de jornadas de la temporada actual para que puedas empezar una nueva desde Tercera.',
    'Si, abandonar liga',
    true,
    function(){
     try{localStorage.removeItem(LS2);}catch(e){}
     MEM[LS2]=null;
     go('liga');
    }
   );
   break;
  case 'ligajugar':{
   var lg=ligaLoad();if(!lg){go('liga');break;}
   var sorted=lg.teams.slice().sort(function(a,b){return b.pts-a.pts||b.w-a.w;});
   var me=null,i;for(i=0;i<lg.teams.length;i++)if(lg.teams[i].you)me=lg.teams[i];
   var pos=sorted.indexOf(me)+1,rival=sorted[(pos-1+3)%30];
   BUILD={ids:LAST_BUILD.ids.slice(),leader:LAST_BUILD.leader};
   sanitizeBuild();
   go('builder',{mode:'liga',rival:rival.n,div:lg.div,jor:lg.jor});
   break;
  }
 }
},false);

document.addEventListener('input',function(ev){
 if(ev.target&&ev.target.id==='fq'){
  FIL.q=ev.target.value;
  var box=document.getElementById('gridBox');
  if(box){
   detachGoldPool(box);
   box.innerHTML=colGrid();
  }
  var c=document.getElementById('cntBox');
  if(c)c.innerHTML=colCountText();
  syncGoldCanvases();
 }
},false);

function medirInsets(){
 try{
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);
  var cs=getComputedStyle(d);
  var t=parseFloat(cs.paddingTop)||0, b=parseFloat(cs.paddingBottom)||0;
  document.body.removeChild(d);
  var st=document.documentElement.style;
  st.setProperty('--sat',Math.max(t,22)+'px');
  st.setProperty('--sab',Math.max(b,12)+'px');
 }catch(e){}
}
window.addEventListener('resize',medirInsets);
window.addEventListener('orientationchange',medirInsets);

function boot(){
 medirInsets();
 try{history.replaceState({s:'menu'},'');}catch(e){}
 var d=D();
 if(d.dtGoldUnlocked&&d.dtGoldActive)ensureGoldLoop();
 paint();
 if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
}
try{if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();}
catch(e){window.onerror(e.message,'boot',0,0);}
})();
</script>
</body>
</html>
