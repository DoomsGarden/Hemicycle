# Publicación manual; los pushes no lanzan este workflow.
name: Publicar Hemiciclo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: hemicycle-controlled-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio preparado
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: '1200000'
