# Publicación manual; los pushes no lanzan este workflow.
name: Publicar Hemiciclo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: hemicycle-controlled-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5.0.0
        id: artifact
        with:
          path: ./_site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publicar sitio preparado
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_TIMEOUT_MS: '1200000'
        run: node _dev/ci/publish-pages.cjs
